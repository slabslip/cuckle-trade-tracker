# Refresh data/ui/news.json whenever a share lands (or on a short backup poll).
#
# Immediate path: Supabase INSERT/UPDATE on news_submissions → repository_dispatch
# with event_type `news-submission`. Setup: docs/SUPABASE_SETUP.md §3d.
#
# Backup: every minute if the Supabase ping (§3d) is not wired yet.
# workflow_dispatch for a manual Actions → Run workflow.
name: news-refresh

on:
  repository_dispatch:
    types: [news-submission]
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Sleeper players dictionary
        uses: actions/cache@v4
        with:
          path: data/players.nfl.json
          key: players-nfl-${{ runner.os }}-v1
          restore-keys: |
            players-nfl-${{ runner.os }}-

      - name: Ensure players.nfl.json
        run: node ensure-players.mjs

      - name: Build news.json from the submission queue
        run: node news-sync.mjs

      - name: Detect feed changes
        id: feed
        run: |
          if git diff --quiet -- data/ui/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "news.json unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "news.json changed"
          fi

      - name: Bust DATA_V and regenerate the page
        if: steps.feed.outputs.changed == 'true'
        run: |
          set -e
          STAMP=$(date -u +%Y%m%d%H%M%S)
          node -e "
            const fs = require('fs');
            const p = 'generate-page.mjs';
            let s = fs.readFileSync(p, 'utf8');
            const next = s.replace(/const DATA_V = \"[^\"]+\"/, 'const DATA_V = \"news${STAMP}\"');
            if (next === s) throw new Error('DATA_V not found in generate-page.mjs');
            fs.writeFileSync(p, next);
          "
          node generate-page.mjs

      - name: Commit and push to main
        if: steps.feed.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "cuckle-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ui/news.json generate-page.mjs index.html
          git commit -m "Refresh news feed from shared tweets."
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && break
            echo "push conflict, retry $i"
            sleep $((i * 4))
          done
