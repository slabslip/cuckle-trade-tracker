# Daily market snapshots → reprice the today / even book.
# Scrapes stay here, not inside every league-sync / build.mjs run.
name: values-daily

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-sync-1315431339301806080
  cancel-in-progress: false

jobs:
  values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Sleeper players dictionary
        uses: actions/cache@v4
        with:
          path: data/players.nfl.json
          key: players-nfl-${{ runner.os }}-v1
          restore-keys: |
            players-nfl-${{ runner.os }}-

      - name: Ensure players.nfl.json
        env:
          SLEEPER_FRESH_PLAYERS: "1"
        run: node ensure-players.mjs --fresh

      - name: Snapshot market books
        run: node snapshot-values.mjs

      - name: Formula unit checks
        run: node price-today.test.mjs

      - name: Rebuild Cuckle meter from committed snaps
        env:
          LEAGUE_ID: "1315431339301806080"
          SLEEPER_FRESH_PLAYERS: "1"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build.mjs --fresh-players --skip-snapshot --skip-page --skip-espn --skip-finishes --allow-revalue-fail "$LEAGUE_ID"

      - name: Rebuild GM meter from committed snaps
        continue-on-error: true
        env:
          LEAGUE_ID: "1389723418827460608"
          SLEEPER_FRESH_PLAYERS: "1"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build.mjs --fresh-players --skip-snapshot --skip-page --skip-espn --allow-revalue-fail "$LEAGUE_ID"

      - name: Audit today book
        continue-on-error: true
        run: |
          node audit-values.mjs
          node audit-pass2.mjs

      - name: Bust DATA_V when the priced book or tape changed
        run: |
          set -e
          if git diff --quiet -- \
            data/ui/calculator.json data/ui/pe.json data/ui/marks.json data/ui/cuffs.json \
            data/leagues/*/raw/trades.json \
            data/leagues/*/raw/rosters_now.json \
            data/leagues/*/raw/traded_picks.json \
            data/leagues/*/raw/moves.json \
            data/leagues/*/raw/injury_now.json \
            data/leagues/*/ui/me \
            data/leagues/*/ui/calculator.json \
            data/ui/me; then
            echo "No priced UI / tape change; leave DATA_V"
            exit 0
          fi
          stamp="daily$(date -u +%Y%m%d%H%M%S)"
          node scripts/bust-data-v.mjs "$stamp" "chuckle-shell-v289-cuckle-nightly"

      - name: Commit snaps and UI if changed
        run: |
          set -e
          git config user.name "cuckle-league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/ktc data/fc data/dd data/dp/latest \
            data/value_curve.json data/value_snapshots.json \
            data/leagues data/ui \
            generate-page.mjs index.html sw.js || true
          if git diff --cached --quiet; then
            echo "No value-book changes to commit"
            exit 0
          fi
          git commit -m "Daily player-value snapshots and today-book reprice."
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && break
            echo "push conflict, retry $i"
            sleep $((i * 4))
          done
