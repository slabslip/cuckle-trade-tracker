<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
  <title>Design — Apple join</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #0b0b0d; color: #9a9aa3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center;
    }
    p { max-width: 20rem; text-align: center; line-height: 1.45; font-size: 0.875rem; }
  </style>
</head>
<body>
  <p>Opening Join a league (mock Apple session)…</p>
  <script>
    (function () {
      var user = {
        access_token: "design-mode",
        refresh_token: "",
        expires_at: Math.floor(Date.now() / 1000) + 86400,
        user_id: "design-user",
        username: "appleTester",
        sleeper_user_id: null,
        espn_user_id: null,
        seat_user_id: null,
        seat_name: null
      };
      try {
        localStorage.setItem("cuckle.auth.v2", JSON.stringify(user));
        localStorage.removeItem("cuckle.memberships.v1");
        localStorage.removeItem("cuckle.active_league.v1");
      } catch (err) {
        document.querySelector("p").textContent =
          "Allow localStorage on this origin, then reload.";
        return;
      }
      location.replace("./index.html?store=1&_=" + Date.now());
    })();
  </script>
</body>
</html>
