<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>iPhone preview — League home</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a2a32 0%, transparent 55%),
        #121216;
    }
    .stage {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: #a0a0a8; font-size: 0.8125rem; text-align: center;
    }
    .stage a { color: #f2f2f4; }
    /* iPhone 14/15 Pro-ish shell */
    .phone {
      position: relative;
      width: 390px;
      height: min(844px, calc(100vh - 72px));
      border-radius: 54px;
      padding: 12px;
      background: linear-gradient(160deg, #3a3a42 0%, #1c1c20 40%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px #4a4a52,
        0 0 0 3px #0a0a0c,
        0 28px 80px rgba(0,0,0,0.65);
      box-sizing: border-box;
    }
    .screen {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 42px;
      overflow: hidden;
      background: #0b0b0d;
    }
    .island {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 34px; border-radius: 20px;
      background: #000; z-index: 3; pointer-events: none;
    }
    .home-bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 128px; height: 5px; border-radius: 99px;
      background: rgba(255,255,255,0.35); z-index: 3; pointer-events: none;
    }
    iframe {
      width: 100%; height: 100%; border: 0; display: block;
      background: #0b0b0d;
    }
    .hint { max-width: 26rem; line-height: 1.45; margin: 0; }
    .title {
      margin: 0; color: #f2f2f4; font-size: 1.05rem; font-weight: 650;
      letter-spacing: -0.02em;
    }
    .urls {
      margin: 0; max-width: 28rem; font-size: 0.75rem; color: #8a8a93;
      line-height: 1.45;
    }
    .urls code { color: #c8c8d0; font-size: 0.72rem; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="title">iPhone preview — PSA league home</p>
    <p class="hint">News Feed + Latest trade inside the bezel.
      For clickable Design Mode DOM (no bezel), open
      <a href="./design-league-home.html">design-league-home.html</a>.</p>
    <p class="urls">Also:
      <code>iphone-preview.html</code> ·
      <code>preview.html</code> ·
      Simple Browser →
      <code>http://127.0.0.1:8799/design-league-home-frame.html</code>
    </p>
    <div class="phone" aria-label="iPhone frame">
      <div class="screen">
        <div class="island" aria-hidden="true"></div>
        <iframe id="frame" title="League home" src="about:blank"></iframe>
        <div class="home-bar" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var user = {
        access_token: "design-mode", refresh_token: "",
        expires_at: Math.floor(Date.now() / 1000) + 86400,
        user_id: "design-user", username: "designer",
        seat_user_id: "457779824002330624", seat_name: "SF69erss"
      };
      var league = {
        sleeper_league_id: "1315431339301806080", name: "CuckleChunckle",
        status: "ready", sleeper_user_id: "457779824002330624", team_name: "SF69erss"
      };
      try {
        localStorage.setItem("cuckle.auth.v1", JSON.stringify(user));
        localStorage.setItem("cuckle.active_league.v1", JSON.stringify(league));
        localStorage.setItem("cuckle.memberships.v1", JSON.stringify([league]));
        sessionStorage.setItem("cuckle.design.league_home", "1");
      } catch (e) { /* private mode */ }
      // Load design entry (clears SW) then lands on league home.
      document.getElementById("frame").src =
        "./design-league-home.html?v=news-seat-tag-0120&frame=1&_=" + Date.now();
    })();
  </script>
</body>
</html>
