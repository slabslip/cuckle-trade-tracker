<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Design — League home (PSA)</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #0b0b0d; color: #9a9aa3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center;
    }
    p { max-width: 20rem; text-align: center; line-height: 1.45; font-size: 0.875rem; }
  </style>
</head>
<body>
  <p>Opening PSA league home for Design Mode…</p>
  <script>
    (function () {
      // Optional ?seat= for persona walks (default Truman / proxy).
      var seats = {
        truman: { id: "458342725222133760", name: "TrumanCooper" },
        kinghenry: { id: "458715702119886848", name: "KingHenryXXVI" },
        arae: { id: "458004578168729600", name: "ARae" },
        chief: { id: "457945712932417536", name: "ChiefGumby" },
        tipsup: { id: "457784547094818816", name: "TipsUp" },
        bubba: { id: "458723431387492352", name: "BubbaCuckShremp" },
        darkwing: { id: "458766127967760384", name: "DarkWingDucks2023" },
        bigjberg: { id: "458315051980288000", name: "bigjberg" },
        ted: { id: "470311990468800512", name: "TedCumberbatch" },
        sf: { id: "457779824002330624", name: "SF69erss" }
      };
      var key = String(new URLSearchParams(location.search).get("seat") || "truman")
        .toLowerCase().replace(/[^a-z0-9]/g, "");
      var seat = seats[key] || seats.truman;
      var user = {
        access_token: "design-mode",
        refresh_token: "",
        expires_at: Math.floor(Date.now() / 1000) + 86400,
        user_id: "design-user",
        username: "designer",
        seat_user_id: seat.id,
        seat_name: seat.name
      };
      var league = {
        sleeper_league_id: "1315431339301806080",
        name: "CuckleChunckle",
        status: "ready",
        sleeper_user_id: seat.id,
        team_name: seat.name
      };
      try {
        localStorage.setItem("cuckle.auth.v1", JSON.stringify(user));
        localStorage.setItem("cuckle.active_league.v1", JSON.stringify(league));
        localStorage.setItem("cuckle.memberships.v1", JSON.stringify([league]));
        // Sticky for the tab: boot + openLeagueDashboard keep reading this after syncUrl
        // strips ?design= (otherwise soft-delete sync / Your leagues can blank Design Mode).
        sessionStorage.setItem("cuckle.design.league_home", "1");
        sessionStorage.setItem("cuckle.design.seat", key);
      } catch (err) {
        document.querySelector("p").textContent =
          "Allow localStorage on this origin, then reload.";
        return;
      }
      var go = function () {
        // Unique cache-bust so a stale document / SW shell is not reused.
        location.replace("./index.html?design=league-home&v=run-lens-1803&_=" + Date.now());
      };
      if (!("serviceWorker" in navigator)) {
        go();
        return;
      }
      // Drop every registration and cache bucket that could still hold a blank/pre-PSA shell.
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        if (!("caches" in window)) return;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }).catch(function () { /* still open the app */ }).then(go);
    })();
  </script>
</body>
</html>
