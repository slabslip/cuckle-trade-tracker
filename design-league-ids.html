<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Design — Gm league IDs</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #0b0b0d; color: #9a9aa3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center;
    }
    p { max-width: 20rem; text-align: center; line-height: 1.45; font-size: 0.875rem; }
  </style>
</head>
<body>
  <p>Opening Gm league IDs…</p>
  <script>
    (function () {
      var user = {
        access_token: "design-mode",
        refresh_token: "",
        expires_at: Math.floor(Date.now() / 1000) + 86400,
        user_id: "design-user",
        username: "designer",
        seat_user_id: "458342725222133760",
        seat_name: "TrumanCooper"
      };
      var league = {
        sleeper_league_id: "1389723418827460608",
        name: "Gm 2026 LLJ",
        status: "ready",
        sleeper_user_id: "458342725222133760",
        team_name: "TrumanCooper"
      };
      try {
        localStorage.setItem("cuckle.auth.v1", JSON.stringify(user));
        localStorage.setItem("cuckle.active_league.v1", JSON.stringify(league));
        localStorage.setItem("cuckle.memberships.v1", JSON.stringify([league]));
        sessionStorage.setItem("cuckle.design.league_home", "1");
      } catch (err) {
        document.querySelector("p").textContent =
          "Allow localStorage on this origin, then reload.";
        return;
      }
      location.replace("./index.html?design=league-home&league=1389723418827460608&ids=gm&_=" + Date.now());
    })();
  </script>
</body>
</html>
