<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
  <title>Design — Trade helper Buy/Sell</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #0b0b0d; color: #9a9aa3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center;
    }
    p { max-width: 22rem; text-align: center; line-height: 1.45; font-size: 0.875rem; }
  </style>
</head>
<body>
  <p>Opening Trade helper (Buy/Sell) in Design Mode…</p>
  <script>
    (function () {
      var seat = { id: "458342725222133760", name: "TrumanCooper" };
      var user = {
        access_token: "design-mode",
        refresh_token: "",
        expires_at: Math.floor(Date.now() / 1000) + 86400,
        user_id: "design-user",
        username: "designer",
        seat_user_id: seat.id,
        seat_name: seat.name
      };
      var league = {
        sleeper_league_id: "1315431339301806080",
        name: "CuckleChunckle",
        status: "ready",
        sleeper_user_id: seat.id,
        team_name: seat.name
      };
      try {
        localStorage.setItem("cuckle.auth.v2", JSON.stringify(user));
        localStorage.setItem("cuckle.active_league.v1", JSON.stringify(league));
        localStorage.setItem("cuckle.memberships.v1", JSON.stringify([league]));
        sessionStorage.setItem("cuckle.design.league_home", "1");
        sessionStorage.setItem("cuckle.design.seat", "truman");
      } catch (err) {
        document.querySelector("p").textContent =
          "Allow localStorage on this origin, then reload.";
        return;
      }
      var go = function () {
        location.replace(
          "./index.html?design=league-home&view=data&tile=trade_helper&v=buy-sell&_=" + Date.now()
        );
      };
      if (!("serviceWorker" in navigator)) {
        go();
        return;
      }
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        if (!("caches" in window)) return;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }).catch(function () {}).then(go);
    })();
  </script>
</body>
</html>
