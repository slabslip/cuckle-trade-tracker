     * let a Design Mode reload run soft-delete sync and blank the News Feed.
     */
    function syncDesignIphoneStage() {
      if (!document.documentElement.classList.contains("design-iphone")) return;
      try {
        var r = document.body.getBoundingClientRect();
        var root = document.documentElement.style;
        root.setProperty("--design-left", Math.round(r.left) + "px");
        root.setProperty("--design-top", Math.round(r.top) + "px");
        root.setProperty("--design-width", Math.round(r.width) + "px");
        root.setProperty("--design-height", Math.round(r.height) + "px");
      } catch (err) { /* ignore */ }
    }

    function armDesignIphoneStage() {
      try {
        document.documentElement.classList.add("design-iphone");
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute("content", "width=390, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
      } catch (err) { /* ignore */ }
      syncDesignIphoneStage();
      if (window.__designIphoneArmed) return;
      window.__designIphoneArmed = true;
      window.addEventListener("resize", syncDesignIphoneStage);
      window.addEventListener("scroll", syncDesignIphoneStage, true);
      // After fonts/layout settle — keeps Design picker boxes on the chips.
      setTimeout(syncDesignIphoneStage, 0);
      setTimeout(syncDesignIphoneStage, 250);
      setTimeout(syncDesignIphoneStage, 1000);
    }

    function closeLeaguesDrawer(immediate) {
      const drawer = document.getElementById("leaguesDrawer");
      leaguesDrawerOpen = false;
      document.body.classList.remove("has-leagues-drawer");
      if (!drawer) return;
      const finish = () => {
        if (leaguesDrawerOpen) return;
        drawer.hidden = true;
        drawer.setAttribute("aria-hidden", "true");
      };
      const wasOpen = drawer.classList.contains("is-open");
      drawer.classList.remove("is-open");
      if (immediate || !wasOpen) {
        finish();
        return;
      }
      const panel = drawer.querySelector(".leagues-drawer-panel");
      let done = false;
      const onEnd = (ev) => {
        if (ev && ev.target !== panel) return;
        if (done) return;
        done = true;
        if (panel) panel.removeEventListener("transitionend", onEnd);
        finish();
      };
      if (panel) panel.addEventListener("transitionend", onEnd);
      setTimeout(onEnd, 400);
    }

    /**
     * Brand Back (chevron) — hierarchical, parent first:
     * - overlays / vote sheets close first
     * - Past Champions year → champions list → History tab
     * - Draft Data / Cuffs (from History) → History tab
     * - History data-set drill → History list
     * - Teams / Ledger / History tabs → League (Latest trade)
     * - league homepage → Your leagues drawer
     * - Team settings → team home
     * - other nested screens → league homepage
     */
    function onBrandBack() {
      if (leaguesDrawerOpen) {
        closeLeaguesDrawer();
        return;
      }
      if (appScreen === "gate" || appScreen === "home") return;
      if (voteSheetTx || voteConfirmTx) {
        voteSheetTx = null;
        voteSheetSeat = null;
        voteConfirmTx = null;
        voteConfirmSeat = null;
        voteEditTx = null;
        render();
        return;
      }
      // Past Champions year detail → champions list (same as ← All champions chip).
      if (appScreen === "dash" && !me && view === "titles" && titleYear) {
        goBack(() => {
          titleYear = null;
          focusNext = ".screen-h";
          render();
        });
        return;
      }
      // History full-screen children → History tab (not league home / clearLeague).
      if (appScreen === "dash" && !me
          && (view === "titles" || view === "draftdata" || view === "cuffs")) {
        goBack(() => setHomeTab("history", { force: true }));
        return;
      }
      // League-home History drill-in: clear the selected set first, keep the History tab.
      if (appScreen === "dash" && !me && view === "home" && homeTab === "history" && dataSet) {
        dataSet = null;
        focusNext = ".screen-h";
        render();
        return;
      }
      // Top tabs: Back returns to Latest trade (same shell) instead of leaving the league.
      if (appScreen === "dash" && !me && view === "home" && homeTab && homeTabCanon(homeTab) !== "home") {
        setHomeTab("home", { force: true });
        return;
      }
      if (isLeagueHomeSurface()) {
        if (typeof newsPullupLocksHome === "function" && newsPullupOpen) {
          if (typeof setNewsPullupOpen === "function") setNewsPullupOpen(false);
          return;
        }
        openLeaguesDrawer();
        return;
      }
      if ((appScreen === "settings" || appScreen === "profile")
          && activeLeague && authSeatId()) {
        closeLeaguesDrawer(true);
        appScreen = "dash";
        openMyTeamHome();
        return;
      }
      // Seat meter: section tabs / trade → seat home; seat home → prior screen (Teams if cold).
      if (appScreen === "dash" && me) {
        if (view !== "home") {
          goBack(() => {
            view = "home";
            openId = null;
            tradeSeat = null;
            partnerName = null;
            openPick = null;
            openDraft = null;
            markOpen = null;
            focusNext = ".screen-h";
            render();
          });
          return;
        }
        goBack(() => {
          me = null;
          data = null;
          setHomeTab("teams", { force: true });
        });
        return;
      }
      returnToLeagueHome();
    }

    function applyLocalAvatarsForLeague(leagueId) {
      const store = readLocalAvatarStore();
      const pack = store[String(leagueId)] || {};
      for (const uid of Object.keys(pack)) {
        const data = safeAvatarData(pack[uid]);
        if (!data) continue;
        seatAvatarByUid[String(uid)] = data;
        const m = (members || []).find((x) => x && String(x.user_id) === String(uid));
        if (m && m.name) seatAvatarByName[m.name] = data;

      const store = readLocalAvatarStore();
      const key = String(leagueId);
      const pack = Object.assign({}, store[key] || {});
      if (dataUrl) pack[String(uid)] = dataUrl;
      else delete pack[String(uid)];
      store[key] = pack;
      writeLocalAvatarStore(store);
    }

    /**
     * Pull custom seat avatars for the active league. Anon-readable so vote marks show
     * every voter's crop. Falls back to localStorage when the table is not installed yet
     * or Design Mode has no real JWT.
     */
    async function loadSeatAvatars() {
      const lid = avatarLeagueId();
      if (!lid) return;
      applyLocalAvatarsForLeague(lid);
      if (isDesignLeagueHome()) return;
      try {
        const res = await fetch(
          VOTE_API + "/seat_avatars?select=sleeper_user_id,avatar_data&sleeper_league_id=eq."
            + encodeURIComponent(lid),
          {
            headers: { apikey: VOTE_ANON, Authorization: "Bearer " + VOTE_ANON },
            signal: voteAbort(),
          },
        );
        if (!res.ok) return;
        const rows = await res.json();
        for (const r of rows || []) {
          const data = safeAvatarData(r && r.avatar_data);
          if (!data) continue;
          const uid = String(r.sleeper_user_id);
          seatAvatarByUid[uid] = data;
          const m = (members || []).find((x) => x && String(x.user_id) === uid);
          if (m && m.name) seatAvatarByName[m.name] = data;
        }
      } catch (err) {
        console.error(err);
      }
    }

    function exportCroppedAvatar() {
      if (!profileCrop || !profileCrop.img) return null;
      const size = 128;
      const out = document.createElement("canvas");
      out.width = size;
      out.height = size;
      const ctx = out.getContext("2d");
      if (!ctx) return null;
      const img = profileCrop.img;
      const zoom = Math.max(1, Math.min(3, Number(profileCrop.zoom) || 1));
      const base = Math.max(img.naturalWidth / size, img.naturalHeight / size);
      const scale = base / zoom;
      const dw = img.naturalWidth / scale;
      const dh = img.naturalHeight / scale;
      const ox = Number(profileCrop.ox) || 0;
      const oy = Number(profileCrop.oy) || 0;
      const dx = (size - dw) / 2 + ox;
      const dy = (size - dh) / 2 + oy;
      ctx.fillStyle = "#1a1a1e";
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, dx, dy, dw, dh);
      let dataUrl = out.toDataURL("image/jpeg", 0.85);
      if (!safeAvatarData(dataUrl) || dataUrl.length > 100000) {
        dataUrl = out.toDataURL("image/jpeg", 0.7);
      }
      return safeAvatarData(dataUrl);
    }

    function paintProfileCrop() {
      const canvas = document.getElementById("profileCropCanvas");
      if (!canvas || !profileCrop || !profileCrop.img) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const css = canvas.clientWidth || 280;
      canvas.width = Math.round(css * dpr);
      canvas.height = Math.round(css * dpr);
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const size = css;
      const img = profileCrop.img;
      const zoom = Math.max(1, Math.min(3, Number(profileCrop.zoom) || 1));
      const base = Math.max(img.naturalWidth / size, img.naturalHeight / size);
      const scale = base / zoom;
      const dw = img.naturalWidth / scale;
      const dh = img.naturalHeight / scale;
      const ox = Number(profileCrop.ox) || 0;
      const oy = Number(profileCrop.oy) || 0;
      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (size - dw) / 2 + ox, (size - dh) / 2 + oy, dw, dh);
      // Soft vignette ring so the circular crop is obvious.
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.46, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    let profileDrag = null;
    document.addEventListener("pointerdown", (e) => {
      const stage = e.target && e.target.closest && e.target.closest("[data-profile-crop-stage]");
      if (!stage || !profileCrop || !profileCrop.img) return;
      profileDrag = {
        id: e.pointerId,
        x: e.clientX,
        y: e.clientY,
        ox: Number(profileCrop.ox) || 0,
        oy: Number(profileCrop.oy) || 0,
      };
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });
    document.addEventListener("pointermove", (e) => {
      if (!profileDrag || e.pointerId !== profileDrag.id || !profileCrop) return;
      profileCrop.ox = profileDrag.ox + (e.clientX - profileDrag.x);
      profileCrop.oy = profileDrag.oy + (e.clientY - profileDrag.y);
      paintProfileCrop();
    });
    document.addEventListener("pointerup", (e) => {
      if (profileDrag && e.pointerId === profileDrag.id) profileDrag = null;
    });
    document.addEventListener("pointercancel", (e) => {
      if (profileDrag && e.pointerId === profileDrag.id) profileDrag = null;
    });

    function beginProfileCrop(file) {
      if (!file || !String(file.type || "").startsWith("image/")) {
        profileNote = "Choose a photo (JPEG, PNG, or WebP).";
        render();
        return;
      }
      if (file.size > 12 * 1024 * 1024) {
        profileNote = "That image is too large — try one under 12 MB.";
        render();
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        if (profileCrop && profileCrop.url) URL.revokeObjectURL(profileCrop.url);
        profileCrop = { url: url, img: img, zoom: 1.15, ox: 0, oy: 0 };
        profileNote = "";
        render();
        queueMicrotask(() => paintProfileCrop());
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        profileNote = "Could not read that image.";
        render();
      };
      img.src = url;
    }

    async function saveProfileAvatar() {
      if (profileBusy) return;
      const lid = avatarLeagueId();
      const uid = authSeatId();
      const name = authSeatCanonName() || authSeatName();
      if (!lid || !uid) {
        profileNote = "Claim a seat in a league before setting an avatar.";
        render();
        return;
      }
      const dataUrl = exportCroppedAvatar();
      if (!dataUrl) {
        profileNote = "Crop a photo first.";
        render();
        return;
      }
      profileBusy = true;
      profileNote = "";
      render();
      try {
        setSeatAvatar(uid, name, dataUrl);
        persistLocalAvatar(lid, uid, dataUrl);
        if (!(authSession && authSession.access_token === "design-mode") && !isDesignLeagueHome()) {
          await authRefreshIfNeeded();
          const res = await fetch(
            VOTE_API + "/seat_avatars?on_conflict=sleeper_league_id,sleeper_user_id",
            {
              method: "POST",
              headers: {
                apikey: VOTE_ANON,
                Authorization: "Bearer " + authSession.access_token,
                "Content-Type": "application/json",
                Prefer: "resolution=merge-duplicates,return=minimal",
              },
              body: JSON.stringify({
                sleeper_league_id: lid,
                sleeper_user_id: String(uid),
                avatar_data: dataUrl,
                updated_at: new Date().toISOString(),
              }),
              signal: voteAbort(),
            },
          );
          if (!res.ok) {
            const t = await res.text();
            if (res.status === 404 || /relation .* does not exist/i.test(t)) {
              profileNote = "Saved on this device. Run db/wave11-profile-avatar.sql in Supabase so every device sees it.";
            } else {
              throw new Error("Could not save avatar (" + res.status + "): " + t.slice(0, 160));
            }
          } else {
            profileNote = "Avatar saved — it will show on votes, names, and chips.";
          }
        } else {
          profileNote = "Avatar saved for Design Mode on this device.";
        }
        if (profileCrop && profileCrop.url) URL.revokeObjectURL(profileCrop.url);
        profileCrop = null;
      } catch (err) {
        profileNote = (err && err.message) || "Could not save avatar.";
        console.error(err);
      } finally {
        profileBusy = false;
        render();
      }
    }

    async function resetProfileAvatar() {
      if (profileBusy) return;

    function authEmailForUsername(username) {
      return String(username || "").trim().toLowerCase() + "@" + AUTH_EMAIL_DOMAIN;
    }

    function normalizeUsername(raw) {
      return String(raw || "").trim();

    /** Sleeper team name → valid username (matches DB + authSignUp). */
    function suggestUsernameFromTeam(teamName) {
      // Double-escape \s: this file embeds the page in a template literal, so \s must
      // survive into index.html as \s (whitespace). A single \s becomes /s+/ and strips
      // the letter "s" from usernames (TipsUp → TipUp) — the invite-link signup bug.
      let s = String(teamName || "").trim().replace(/\s+/g, "");
      s = s.replace(/[^A-Za-z0-9_.-]/g, "");
      if (!s || !/^[A-Za-z0-9_]/.test(s)) s = ("team_" + s).replace(/[^A-Za-z0-9_.-]/g, "");
      if (s.length < 3) s = (s + "seat").slice(0, 32);
      return s.slice(0, 32);
    }

    /** Strip spaces and illegal chars before validation so "Truman Cooper" works. */
    function prepareUsername(raw) {
      let name = normalizeUsername(raw);
      if (!name) return "";
      name = name.replace(/\s+/g, "");
      name = name.replace(/[^A-Za-z0-9_.-]/g, "");
      if (name && !/^[A-Za-z0-9_]/.test(name)) name = "_" + name;
      return name.slice(0, 32);
    }

    function validateUsername(name) {
      if (!/^[A-Za-z0-9_][A-Za-z0-9_.-]{2,31}$/.test(name)) {
        throw new Error("Username must be 3–32 characters: letters, numbers, and _ . - only (no spaces).");
      }
      return name;
    }

    function authErrorMessage(data, status, fallback) {
      const code = data && data.error_code;
      const msg = (data && (data.error_description || data.msg || data.message)) || fallback;
      if (code === "email_address_invalid") {
        return "Account email rejected — hard refresh the page (auth fix may not have loaded yet).";
      }
      if (code === "over_email_send_rate_limit") {
        return "Too many sign-up attempts — wait a few minutes. In Supabase, turn Confirm email OFF.";
      }
      if (code === "user_already_exists") return "That username is taken — pick another or sign in.";
      return msg;
    }

    function voteBoxRead() {

        if (found && found.v === 1 && found.votes) box = found;

    // ---- Supabase transport ----------------------------------------------------
    // Two doors above, one wire here. Nothing outside this block knows Supabase exists.

    // Reads can use the anon key (public tallies). Writes must use the claimed-seat JWT.
    function voteHeaders(extra, forWrite) {
      const token = (forWrite && authSession && authSession.access_token)
        ? authSession.access_token
        : VOTE_ANON;
      return Object.assign({ apikey: VOTE_ANON, Authorization: "Bearer " + token }, extra || {});
    }

    // AbortSignal.timeout is missing on Safari before 16, where undefined just means no timeout.
    function voteAbort(ms) {
      const n = ms == null ? VOTE_TIMEOUT : ms;
      try { return AbortSignal && AbortSignal.timeout ? AbortSignal.timeout(n) : undefined; }
      catch (err) { return undefined; }
    }

    async function voteGet(url) {
      const res = await fetch(url, { headers: voteHeaders(), signal: voteAbort() });
      if (!res.ok) throw new Error(url + " " + res.status);
      return res.json();
    }

    // Local time of day. The committed book renders an ISO date; a live tally is minutes old at
    // most, so a clock reads truer than a timestamp.
    function voteStamp(d) {
      try { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
      catch (err) { return d.toISOString(); }
    }

    async function authRefreshIfNeeded(force) {
      if (!authSession || !authSession.refresh_token) return;
      const exp = Number(authSession.expires_at) || 0;
      // Refresh a minute early. expires_at is unix seconds.
      if (!force && exp && (exp - 60) * 1000 > Date.now()) return;
      try {
        const res = await fetch(AUTH_API + "/token?grant_type=refresh_token", {
          method: "POST",
          headers: {
            apikey: VOTE_ANON,
            Authorization: "Bearer " + VOTE_ANON,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ refresh_token: authSession.refresh_token }),
          signal: voteAbort(15000),
        });
        if (!res.ok) {
          // Only clear the session on a real auth rejection — not a blip / timeout.
          if (res.status === 401 || res.status === 403) {
            authClear();
            throw new Error("refresh " + res.status);
          }
          console.warn("refresh " + res.status);
          if (force) throw new Error("refresh " + res.status);
          return;
        }
        const data = await res.json();
        authSave({
          access_token: data.access_token,
          refresh_token: data.refresh_token || authSession.refresh_token,
          expires_at: data.expires_at
            || Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
          user_id: authSession.user_id || (data.user && data.user.id) || null,
          username: authSession.username || null,
          sleeper_user_id: authSession.sleeper_user_id || null,
          espn_user_id: authSession.espn_user_id || null,
          seat_user_id: authSession.seat_user_id || null,
          seat_name: authSession.seat_name || null,
        });
      } catch (err) {
        console.error(err);
        if (force) throw err;
        // Non-force refresh failure: keep the existing session so reads/UI still work.
      }
    }

    async function authPasswordGrant(email, password) {
      const res = await fetch(AUTH_API + "/token?grant_type=password", {
        method: "POST",
        headers: {
          apikey: VOTE_ANON,
          Authorization: "Bearer " + VOTE_ANON,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ email: email, password: password }),
        signal: voteAbort(),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data.error_description || data.msg || data.message || ("Sign-in failed (" + res.status + ")");
        throw new Error(msg);
      }
      return data;
    }

    async function authSignUp(username, password) {
      const name = validateUsername(prepareUsername(username));
      if (String(password || "").length < 6) throw new Error("Password must be at least 6 characters.");
      const email = authEmailForUsername(name);
      const res = await fetch(AUTH_API + "/signup", {
        method: "POST",
        headers: {
          apikey: VOTE_ANON,
          Authorization: "Bearer " + VOTE_ANON,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          email: email,
          password: password,
          data: { username: name },
        }),
        signal: voteAbort(),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(authErrorMessage(data, res.status, "Sign-up failed (" + res.status + ")"));
      }
      let session = data;
      if (!session.access_token) {
        session = await authPasswordGrant(email, password);
      }
      const userId = (session.user && session.user.id) || (data.user && data.user.id);
      if (!userId || !session.access_token) throw new Error("Sign-up did not return a session. Check Confirm email is OFF.");
      const prof = await fetch(VOTE_API + "/app_profiles?on_conflict=auth_user_id", {
        method: "POST",
        headers: {
          apikey: VOTE_ANON,
          Authorization: "Bearer " + session.access_token,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=minimal",
        },
        body: JSON.stringify({ auth_user_id: userId, username: name }),
        signal: voteAbort(),
      });
      if (!prof.ok) {
        const t = await prof.text();
        if (t.indexOf("app_profiles_username_key") >= 0) throw new Error("That username is taken.");
        if (t.indexOf("app_profiles_platform_required") >= 0) {
          throw new Error("Profile blocked: re-run commissioner-invites.sql (platform IDs optional).");
        }
        throw new Error("Could not save profile (" + prof.status + "): " + t.slice(0, 180));
      }
      authSave({
        access_token: session.access_token,
        refresh_token: session.refresh_token,
        expires_at: session.expires_at
          || Math.floor(Date.now() / 1000) + (Number(session.expires_in) || 3600),
        user_id: userId,
        username: name,
        sleeper_user_id: null,
        espn_user_id: null,
        seat_user_id: null,
        seat_name: null,
      });
      paintSettingsBtn();
      paintBrandHome();
    }

    async function authSignIn(username, password) {
      const name = validateUsername(prepareUsername(username));
      if (!password) throw new Error("Enter username and password.");
      const data = await authPasswordGrant(authEmailForUsername(name), password);
      const userId = data.user && data.user.id;
      let uname = name;
      try {
        const pr = await fetch(
          VOTE_API + "/app_profiles?select=username&auth_user_id=eq." + encodeURIComponent(userId),
          {
            headers: { apikey: VOTE_ANON, Authorization: "Bearer " + data.access_token },
            signal: voteAbort(),
          },
        );
        if (pr.ok) {
          const rows = await pr.json();
          if (rows[0] && rows[0].username) uname = rows[0].username;
        }
      } catch (err) { /* username from form is fine */ }
      authSave({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: data.expires_at
          || Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
        user_id: userId,
        username: uname,
        sleeper_user_id: null,
        espn_user_id: null,
        seat_user_id: null,
        seat_name: null,
      });
      paintSettingsBtn();
      paintBrandHome();
    }

        saveMemberships([]);
        ownedLeagues = [];
        return [];

      await authRefreshIfNeeded();
      const headers = {
        apikey: VOTE_ANON,
        Authorization: "Bearer " + authSession.access_token,
      };
      const [memRes, ownRes] = await Promise.all([
        fetch(
          VOTE_API + "/league_memberships?select=*,leagues(name,status,season,total_rosters)&order=created_at.asc",
          { headers: headers, signal: voteAbort() },

            + encodeURIComponent(authSession.user_id)

      const list = (rows || []).map((r) => ({

          name: r.name || r.sleeper_league_id,
          status: r.status || "pending_sync",
          season: r.season || null,
          role: "commissioner",

        ownedLeagues = [];
      }
      return list;
    }

    async function joinLeagueCall(action, fields) {

      });

    // Phase 1: voter identity is the claimed seat only. Legacy device ids remain in local
    // tallies for display heal until the optional truncate; new writes never use them.
    function voteVoterIds() {
      const ids = [];
      const seat = authSeatId();
      if (seat) ids.push(seat);
      const votes = voteBoxRead().votes;
      for (const tx of Object.keys(votes)) {
        const s = votes[tx].seat;
        if (s && ids.indexOf(s) < 0) ids.push(s);
      }
      return ids.filter((x) => x && x !== "device-unavailable" && /^[\w.-]+$/.test(x));
    }

    // One read of the whole tally per page load — the view returns every trade at once and it is
    // a handful of rows, so no card ever fires its own request.
    //
    // Plus one narrow read of our own ballots. That second read is load bearing: the view has
    // aggregated the ballots away, so there is no way to tell from it whether the total for a
    // trade already counts us. Without it the choice is between double-counting our own vote and
    // hiding it, and both are wrong.
    //
    // Ballots (voter+choice) load first and are the source of truth for flairs. If the tallies
    // view 401s or is missing, we synthesize counts from those ballots so every claimed seat
    // still sees every other manager's vote.
    async function voteLoad() {
      voteLiveState = "loading";
      await authRefreshIfNeeded();
      const ids = voteVoterIds();
      const leagueId = (activeLeague && activeLeague.sleeper_league_id) || CUCKLE_LEAGUE_ID;
      const memberIds = new Set(
        (members || []).map((m) => (m && m.user_id != null ? String(m.user_id) : "")).filter(Boolean)
      );
      try {
        const tallyQ = VOTE_API + "/trade_vote_tallies?select=*&sleeper_league_id=eq."
          + encodeURIComponent(leagueId);
        const mineQ = ids.length
          ? VOTE_API + "/trade_votes?select=transaction_id,choice,created_at&voter=in.(" + ids.join(",")
            + ")&sleeper_league_id=eq." + encodeURIComponent(leagueId)
            + "&choice=neq." + encodeURIComponent(VOTE_CLEARED)
          : null;
        const ballotsQ = VOTE_API + "/trade_votes?select=transaction_id,choice,voter&sleeper_league_id=eq."
          + encodeURIComponent(leagueId)
          + "&choice=neq." + encodeURIComponent(VOTE_CLEARED);

        // Ballots first so a broken tallies view cannot hide other managers' votes.
        let ballotRows = [];
        try {
          ballotRows = await voteGet(ballotsQ);
        } catch (ballotErr) {
          console.warn("vote ballot marks load failed; count-only lean", ballotErr);
          try {
            ballotRows = await voteGet(VOTE_API + "/trade_votes?select=transaction_id,choice,voter"
              + "&choice=neq." + encodeURIComponent(VOTE_CLEARED));
          } catch (ballotErr2) {
            ballotRows = [];
          }
        }

        let rows = null;
        let mineRows = [];
        try {
          const parts = [voteGet(tallyQ)];
          if (mineQ) parts.push(voteGet(mineQ));
          const got = await Promise.all(parts);
          rows = got[0];
          mineRows = got[1] || [];
        } catch (scopedErr) {
          console.warn("scoped vote tallies failed; using ballots", scopedErr);
          try {
            mineRows = mineQ ? await voteGet(mineQ) : [];
          } catch (mineErr) {
            mineRows = [];
          }
          rows = null;
        }

        const totals = {};
        if (rows && rows.length) {
          for (const r of rows) {
            if (!r || !r.transaction_id || !r.choice || r.choice === VOTE_CLEARED) continue;
            const box = totals[r.transaction_id] || (totals[r.transaction_id] = {});
            box[r.choice] = (box[r.choice] || 0) + (r.votes || 0);
          }
        } else {
          // Synthesize tallies from raw ballots so a broken tallies view cannot hide
          // everyone else's votes (Ducks flair / counts on Latest trade).
          for (const r of ballotRows || []) {
            if (!r || !r.transaction_id || !r.voter || !r.choice || r.choice === VOTE_CLEARED) continue;
            if (memberIds.size && !memberIds.has(String(r.voter))) continue;
            const box = totals[r.transaction_id] || (totals[r.transaction_id] = {});
            box[r.choice] = (box[r.choice] || 0) + 1;
          }
        }
        const mine = {};
        const mineAt = {};
        for (const r of mineRows || []) {
          if (!r || !r.transaction_id || !r.choice || r.choice === VOTE_CLEARED) continue;
          mine[r.transaction_id] = r.choice;
          if (r.created_at) mineAt[r.transaction_id] = r.created_at;
        }
        // voter → choice per trade. Cleared rows stay out; one voter can only pick one side.
        const ballots = {};
        for (const r of ballotRows || []) {
          if (!r || !r.transaction_id || !r.voter || !r.choice || r.choice === VOTE_CLEARED) continue;
          if (memberIds.size && !memberIds.has(String(r.voter))) continue;
          const box = ballots[r.transaction_id] || (ballots[r.transaction_id] = {});
          box[r.voter] = r.choice;
        }
        voteLive = { asOf: voteStamp(new Date()), totals: totals, mine: mine, mineAt: mineAt, ballots: ballots };
        voteLiveState = "ok";
        voteReloadAt = Date.now();
      } catch (err) {
        console.error(err);
        voteLive = null;
        voteLiveState = "fail";
      }
      voteHydrateFromServer();
      voteHeal();
      ledgerMaybeRender();
    }

    // Re-pull league ballots when the manager returns to the tab so Ducks/Truman/new seats
    // see each other's votes without a full page reload.
    function voteReloadIfStale(minMs) {
      if (document.visibilityState && document.visibilityState !== "visible") return;
      if (appScreen !== "dash" || !activeLeague) return;
      const gap = minMs == null ? 2000 : minMs;
      if (Date.now() - voteReloadAt < gap) return;
      voteLoad().catch((err) => console.error(err));
    }

    function voteCreatedAtMs(iso) {
      if (!iso) return 0;
      const n = Date.parse(iso);
      return Number.isFinite(n) ? n : 0;
    }

    /** True when the initial cast is older than VOTE_EDIT_MS (locked: one vote, no more changes). */
    function voteIsLockedAt(createdAtIso) {
      const t0 = voteCreatedAtMs(createdAtIso);
      if (!t0) return false; // unknown cast time — allow edit until server created_at arrives
      return (Date.now() - t0) >= VOTE_EDIT_MS;
    }

    function voteCreatedAtFor(transactionId, localEntry) {
      if (localEntry && localEntry.createdAt) return localEntry.createdAt;
      if (voteLive && voteLive.mineAt && voteLive.mineAt[transactionId]) {
        return voteLive.mineAt[transactionId];
      }
      if (localEntry && localEntry.ts) return localEntry.ts; // legacy local-only first write
      return null;
    }

    function voteIsLocked(transactionId) {
      const local = voteBoxRead().votes[transactionId] || null;
      return voteIsLockedAt(voteCreatedAtFor(transactionId, local));
    }

    /**
     * Phone and laptop must show the same ballot. Pull server "mine" into localStorage when
     * this device has no local row (or only a stale unlocked mismatch that the server locked).
     * Never invent a clear from local absence.
     */
    function voteHydrateFromServer() {
      if (voteLiveState !== "ok" || !voteLive || !authSeatId()) return;
      const seat = authSeatId();
      const box = voteBoxRead();
      let dirty = false;
      const mine = voteLive.mine || {};
      const mineAt = voteLive.mineAt || {};
      for (const tx of Object.keys(mine)) {
        const serverChoice = mine[tx];
        if (!serverChoice || serverChoice === VOTE_CLEARED) continue;
        const createdAt = mineAt[tx] || null;
        const local = box.votes[tx];
        if (!local || !local.choice) {
          box.votes[tx] = { choice: serverChoice, seat: seat, ts: createdAt || new Date().toISOString(), createdAt: createdAt || null };
          dirty = true;
          continue;
        }
        // Carry first-cast time onto legacy local rows.
        if (createdAt && local.createdAt !== createdAt) {
          local.createdAt = createdAt;
          dirty = true;
        }
        // Locked server ballot wins over a divergent local edit attempt.
        if (createdAt && voteIsLockedAt(createdAt) && local.choice !== serverChoice) {
          local.choice = serverChoice;
          local.seat = seat;
          local.createdAt = createdAt;
          dirty = true;
        }
      }
      if (dirty) voteBoxWrite(box);
    }

    // localStorage may be ahead while offline; push local → server when unlocked and divergent.
    // Never clear the server from local absence. Heal passes priorLocal so a failed retry cannot
    // wipe the only ballot on this device.
    //
    // Phase 1: heal only runs when a seat is claimed — anon can no longer write.
    function voteHeal() {
      if (voteLiveState !== "ok") return;
      if (!authSeatId()) return;
      const votes = voteBoxRead().votes;
      for (const tx of Object.keys(votes)) {
        const entry = votes[tx];
        const local = (entry && entry.choice) || null;
        if (!local) continue;
        const onServer = (voteLive.mine && voteLive.mine[tx]) || null;
        if (onServer === local) continue;
        if (voteIsLocked(tx)) continue; // do not fight a locked server row
        const prior = entry
          ? { choice: entry.choice, seat: entry.seat, ts: entry.ts, createdAt: entry.createdAt || null }
          : null;
        votePush(tx, local, authSeatId(), prior);
      }
    }

    // Optimistic: the vote is in localStorage and on screen before this runs. The upsert names
    // its conflict target explicitly because PostgREST otherwise infers the primary key, which is
    // the surrogate id — leave it off and a second vote fails on the unique constraint.
    // voter is rewritten by the trade_votes_force_voter trigger; we still send the claimed seat.
    // priorLocal: when set (user tap), a failed write restores that ballot so this phone cannot
    // look like it voted when Supabase never got the row — that was how Ducks saw 2 and Truman 1.
    function votePush(transactionId, choice, seat, priorLocal) {
      votePushAsync(transactionId, choice, seat, priorLocal).catch((err) => console.error(err));
    }

    function voteWriteErrorMessage(err) {
      const raw = String((err && err.message) || err || "");
      if (/vote locked after 24 hours|locked after 24/i.test(raw)) {
        return "Vote locked — you can only change it within 24 hours of your first cast.";
      }
      if (/vote cannot be cleared|cannot be cleared/i.test(raw)) {
        return "You already voted — change sides within 24 hours of your first cast.";
      }
      if (/no membership/i.test(raw)) {
        return "Vote didn’t save — re-open the league from App home so your seat is claimed.";
      }
      if (/refresh 401|refresh 403|signed out|401/i.test(raw)) {
        return "Vote didn’t save — sign in again, then retry.";
      }
      if (/on conflict|unique|42P10/i.test(raw)) {
        return "Vote didn’t save — database vote unique key missing (run wave9 SQL).";
      }
      if (/42501|permission denied|403/i.test(raw)) {
        return "Vote didn’t save — seat permission blocked (run wave9 SQL).";
      }
      return "Vote didn’t save — check connection and try again.";
    }

    async function votePushAsync(transactionId, choice, seat, priorLocal) {
      if (!authSession || !authSession.access_token || !seat) {
        votePending.delete(transactionId);
        render();
        return;
      }
      const sent = choice == null ? VOTE_CLEARED : choice;
      // Design Mode has a fake JWT — settle locally so the home vote feed can be walked.
      if (authSession.access_token === "design-mode" || isDesignLeagueHome()) {
        votePending.add(transactionId);
        voteWriteError = "";
        const local = voteBoxRead().votes[transactionId];
        const created = (local && local.createdAt) || (local && local.ts) || new Date().toISOString();
        voteSettle(transactionId, sent, created);
        return;
      }
      const leagueId = (activeLeague && activeLeague.sleeper_league_id) || CUCKLE_LEAGUE_ID;
      votePending.add(transactionId);
      voteWriteError = "";

      const postOnce = () => {
        const payload = {
          transaction_id: transactionId,
          choice: sent,
          voter: seat,
          sleeper_league_id: leagueId,
        };
        return fetch(VOTE_API + "/trade_votes?on_conflict=sleeper_league_id,transaction_id,voter", {
          method: "POST",
          headers: voteHeaders({
            "Content-Type": "application/json",
            Prefer: "resolution=merge-duplicates,return=representation",
          }, true),
          body: JSON.stringify(payload),
          signal: voteAbort(15000),
        });
      };

      try {
        // Always refresh before a write — expired JWTs were failing home casts with a
        // generic "didn’t save" after the wipe/reclaim stretch.
        try { await authRefreshIfNeeded(false); } catch (refreshErr) { /* read path soft */ }
        if (!authSession || !authSession.access_token) {
          throw new Error("signed out");
        }

        let res = await postOnce();
        if (res.status === 401) {
          try { await authRefreshIfNeeded(true); } catch (refreshErr) {
            throw new Error("signed out");
          }
          if (!authSession || !authSession.access_token) throw new Error("signed out");
          res = await postOnce();
        }
        if (!res.ok) {
          let detail = "";
          try { detail = (await res.text() || "").slice(0, 240); } catch (e) { /* ignore */ }
          throw new Error("vote write " + res.status + (detail ? ": " + detail : ""));
        }
        let rows = [];
        try { rows = await res.json(); } catch (e) { rows = []; }
        const row = (rows || [])[0];
        voteSettle(
          transactionId,
          row && row.choice ? row.choice : sent,
          row && row.created_at ? row.created_at : null,
        );
        // Refresh peer ballots, but keep an open home confirm up (do not auto-dismiss).
        voteLoad().catch((err) => console.error(err));
      } catch (err) {
        console.error(err);
        votePending.delete(transactionId);
        if (priorLocal !== undefined) {
          const box = voteBoxRead();
          if (priorLocal && priorLocal.choice) {
            box.votes[transactionId] = priorLocal;
          } else {
            delete box.votes[transactionId];
          }
          voteBoxWrite(box);
        }
        // Failed home cast: drop the optimistic confirm so we do not show a phantom tally.
        if (voteConfirmTx === transactionId) {
          voteConfirmTx = null;
          voteConfirmSeat = null;
        }
        voteWriteError = voteWriteErrorMessage(err);
        voteToast = null;
        say(voteWriteError);
        render();
      }
    }

    // Fold a confirmed write into the cached tally so the count converges without a second read.
    // Only our own contribution moves; everyone else's stands.
    function voteSettle(transactionId, choice, createdAt) {
      votePending.delete(transactionId);
      if (voteLive) {
        const totals = voteLive.totals[transactionId] || (voteLive.totals[transactionId] = {});
        const was = voteLive.mine[transactionId] || null;
        const now = choice === VOTE_CLEARED ? null : choice;
        if (was !== now) {
          if (was) totals[was] = Math.max(0, (totals[was] || 0) - 1);
          if (now) totals[now] = (totals[now] || 0) + 1;
        }
        if (!voteLive.mineAt) voteLive.mineAt = {};
        if (now) {
          voteLive.mine[transactionId] = now;
          if (createdAt) voteLive.mineAt[transactionId] = createdAt;
          else if (!voteLive.mineAt[transactionId]) {
            voteLive.mineAt[transactionId] = new Date().toISOString();
          }
        } else {
          delete voteLive.mine[transactionId];
          delete voteLive.mineAt[transactionId];
        }
        // Keep the flair map in step with the settled ballot so the lean row does not wait
        // for another full voteLoad.
        const seat = authSeatId();
        if (seat) {
          if (!voteLive.ballots) voteLive.ballots = {};
          const box = voteLive.ballots[transactionId] || (voteLive.ballots[transactionId] = {});
          if (now) box[seat] = now;
          else delete box[seat];
        }
        // asOf is deliberately NOT advanced. It dates the league read, and our own vote landing
        // says nothing about anyone else's. Moving it would claim the other counts were rechecked.
      }
      // Keep local first-cast time stable across devices.
      if (choice && choice !== VOTE_CLEARED && createdAt) {
        const box = voteBoxRead();
        const entry = box.votes[transactionId];
        if (entry) {
          if (!entry.createdAt) entry.createdAt = createdAt;
          voteBoxWrite(box);
        }
      }
      render();
    }

    /** Display name for a seat user_id (voter or trade side). */
    function seatNameForUid(uid) {
      if (uid == null || uid === "") return "";
      const id = String(uid);
      // Coerce both sides — ballots sometimes ship numeric ids, members.json strings.
      const m = (members || []).find((x) => x && String(x.user_id) === id);
      if (m && m.name) return String(m.name);
      if (SEAT_FLAIR[id]) return id;
      return id;
    }

    /**
     * Compact seat flair for the lean vote row. Only real glyph/img flair — no initials
     * fallback (raw voter ids were painting hex chips like "1F" / "BB"). Empty string
     * when the seat has no flair so the row stays blank until a known voter marks it.
     * Wrapped in seat-link + data-who so a tap opens that team's home (same as names).
     */
    function seatVoteMarkHtml(name) {
      const n = String(name == null ? "" : name);
      const f = flairEntry(n);
      let inner = "";
      if (f && f.glyph) {
        inner = '<span class="h2h-lean-glyph" aria-hidden="true">' + f.glyph + "</span>";
      } else if (f && f.img) {
        const cls = f.custom
          ? "seat-flair h2h-lean-flair seat-flair-custom"
          : "seat-flair h2h-lean-flair";
        inner = '<img class="' + cls + '" src="' + flairImgSrc(f.img)
          + '" width="14" height="14" alt="" decoding="async" />';
      } else {
        return "";
      }
      if (!n) return inner;
      return '<span class="seat-link h2h-lean-flair-link" role="link" tabindex="0" data-who="'
        + esc(n) + '" aria-label="' + esc(n) + '">' + inner + "</span>";
    }

    /**
     * Voter → choice map for one trade, with the same local-over-server merge as readVotes.
     * Returns { [choiceUid]: [voterUid, ...] } so the lean row can paint flairs per side.
     */
    function voteMarks(transactionId) {
      const mine = voteBoxRead().votes[transactionId] || null;
      const local = (mine && mine.choice) || null;
      const localSeat = (mine && mine.seat) || authSeatId() || null;
      let byVoter = {};
      if (voteLive && voteLive.ballots) {
        byVoter = Object.assign({}, voteLive.ballots[transactionId] || {});
        const onServer = voteLive.mine[transactionId] || null;
        if (localSeat && onServer !== local) {
          if (local) byVoter[localSeat] = local;
          else delete byVoter[localSeat];
        }
      } else {
        const entry = (voteBook && voteBook.votes && voteBook.votes[transactionId]) || null;
        byVoter = Object.assign({}, (entry && entry.voters) || {});
        if (local && localSeat && !byVoter[localSeat]) byVoter[localSeat] = local;
      }
      const byChoice = {};
      for (const voter of Object.keys(byVoter)) {
        const choice = byVoter[voter];
        if (!choice || choice === VOTE_CLEARED) continue;
        (byChoice[choice] || (byChoice[choice] = [])).push(voter);
      }
      return byChoice;
    }

    // ---- The two doors ---------------------------------------------------------
    // readVotes(transactionId) -> { choice, seat, tally, votes, league, asOf, source, pending }
    // choice is the seat user_id this device voted for, or null. tally maps seat user_id to a
    // count. Precedence for that count: a live Supabase tally, else the committed
    // data/ui/votes.json, else this device alone. localStorage is the source of truth for
    // "my vote"; Supabase is the source of truth for "the league tally".
    function readVotes(transactionId) {
      const mine = voteBoxRead().votes[transactionId] || null;
      const onServer = (voteLive && voteLive.mine && voteLive.mine[transactionId]) || null;
      // Same seat on phone and laptop: prefer local when present (includes in-flight), else server.
      const local = (mine && mine.choice) || onServer || null;
      const createdAt = voteCreatedAtFor(transactionId, mine);
      const locked = !!(local && voteIsLockedAt(createdAt));
      let tally, league, asOf, source;
      if (voteLive) {
        tally = Object.assign({}, voteLive.totals[transactionId] || {});
        // Where the server's record of our ballot disagrees with localStorage, localStorage wins
        // on screen and the difference is exactly what is still in flight — unless locked, in
        // which case the server ballot is authoritative.
        const serverChoice = voteLive.mine[transactionId] || null;
        const shown = locked ? (serverChoice || local) : local;
        if (serverChoice !== shown) {
          if (serverChoice) tally[serverChoice] = Math.max(0, (tally[serverChoice] || 0) - 1);
          if (shown) tally[shown] = (tally[shown] || 0) + 1;
        }
        league = true;
        asOf = voteLive.asOf;
        source = "live";
      } else {
        const entry = (voteBook && voteBook.votes && voteBook.votes[transactionId]) || null;
        tally = Object.assign({}, (entry && entry.totals) || {});
        const alreadyCounted = !!(entry && entry.voters && mine && mine.seat && entry.voters[mine.seat]);
        if (local && !alreadyCounted) tally[local] = (tally[local] || 0) + 1;
        league = !!entry;
        asOf = (voteBook && voteBook.generated_at) || null;
        source = entry ? "book" : "local";
      }
      let votes = 0;
      for (const k of Object.keys(tally)) {
        if (!tally[k]) delete tally[k];
        else votes += tally[k];
      }
      const shownChoice = locked
        ? ((voteLive && voteLive.mine && voteLive.mine[transactionId]) || local)
        : local;
      return {
        choice: shownChoice,
        seat: (mine && mine.seat) || authSeatId() || null,
        tally: tally,
        votes: votes,
        league: league,
        asOf: asOf,
        source: source,
        pending: votePending.has(transactionId),
        createdAt: createdAt,
        locked: locked,
        canEdit: !!(shownChoice && !locked),
      };
    }

    // writeVote(transactionId, choice) -> void.
    // One ballot per claimed seat per trade. Null clears are rejected once cast — change sides
    // within 24h of the initial cast instead. After 24h the ballot is locked on every device.
    // Phase 1: gated on a claimed seat. The Teams picker is not enough — invite code required.
    function writeVote(transactionId, choice) {
      const seat = authSeatId();
      if (!seat) {
        render();
        return;
      }
      const box = voteBoxRead();
      const prevEntry = box.votes[transactionId] || null;
      const prev = prevEntry
        ? {
            choice: prevEntry.choice,
            seat: prevEntry.seat,
            ts: prevEntry.ts,
            createdAt: prevEntry.createdAt || null,
          }
        : null;
      const had = !!(prev && prev.choice);
      const serverChoice = (voteLive && voteLive.mine && voteLive.mine[transactionId]) || null;
      const existing = (prev && prev.choice) || serverChoice || null;

      // One vote: never clear a cast ballot (old same-side-tap clear removed).
      if (choice == null) {
        if (existing) {
          voteWriteError = "You already voted — change sides within 24 hours of your first cast.";
          say(voteWriteError);
          render();
          return;
        }
        voteEditTx = null;
        return;
      }

      if (existing && existing === choice) {
        voteEditTx = null;
        render();
        return;
      }

      const createdAt = voteCreatedAtFor(transactionId, prevEntry);
      if (existing && voteIsLockedAt(createdAt)) {
        voteWriteError = "Vote locked — you can only change it within 24 hours of your first cast.";
        say(voteWriteError);
        voteEditTx = null;
        render();
        return;
      }

      const nowIso = new Date().toISOString();
      box.votes[transactionId] = {
        choice: choice,
        seat: seat,
        ts: nowIso,
        // First cast stamps createdAt; edits keep the original.
        createdAt: had ? (prev.createdAt || createdAt || prev.ts || nowIso) : (createdAt || nowIso),
      };
      voteBoxWrite(box);
      voteEditTx = null;
      votePush(transactionId, choice, seat, prev);
    }

    /**
     * Two parties for a trade, ordered to match the H2H chip: left = framing row's seat
     * (r.user_id / r.name), right = counterparty. trade_boards.sides insertion order alone is
     * NOT chip order — opening a deal via the other seat (tradeSeat / seat tab "me") flips
     * name|other on the chip while sides order stays fixed; vote buttons must follow the chip.
     */
    function voteSeats(r) {
      const sides = (league && league.trade_boards && league.trade_boards.sides) || [];
      const seats = [];
      for (const s of sides) {
        if (s.transaction_id !== r.transaction_id) continue;
        if (!seats.some((x) => x.uid === s.user_id)) seats.push({ uid: s.user_id, name: s.name });
      }
      if (r && r.user_id && seats.length === 2 && seats[1].uid === r.user_id) {
        seats.reverse();
      }
      return seats;
    }

    function isVoteFair(choice) {
      return choice === VOTE_FAIR;
    }

    /** Display label for a ballot choice (seat name or Fair). */
    function voteChoiceLabel(choice, seats) {
      if (isVoteFair(choice)) return "Fair";
      const hit = (seats || []).find(function (s) { return s.uid === choice; });
      return hit ? hit.name : "?";
    }

    /** Compact a–f–b tally string (team A, Fair, team B). */
    function voteTallyTriple(v, seats) {
      const a = v.tally[seats[0].uid] || 0;
      const f = v.tally[VOTE_FAIR] || 0;
      const b = v.tally[seats[1].uid] || 0;
      return a + "–" + f + "–" + b;
    }

    function voteOptButtonHtml(tx, choice, labelHtml, v, fair) {
      const on = v.choice === choice;
      const n = v.tally[choice] || 0;
      const line = v.votes
        ? n + (n === 1 ? " vote · " : " votes · ") + Math.round(n / v.votes * 100) + "%"
        : "tap to vote";
      return '<button type="button" class="vote-opt'
        + (on ? " on" : "")
        + (fair ? " is-fair" : "")
        + '"'
        + ' data-vote="' + esc(tx) + '" data-vote-seat="' + esc(choice) + '"'
        + ' aria-pressed="' + (on ? "true" : "false") + '">'
        + "<b>" + labelHtml + "</b><span>" + line + "</span></button>";
    }

    function voteParties(r) {
      // Prefer the bag already painted for this tx (seat tab / feed cache) so N-way detection
      // cannot disagree between the H2H chip and the vote buttons on the same card.
      const hit = bagHitForTx(r.transaction_id)
        || ((seatCache[r.user_id] || {}).trades || [])
          .find((t) => t.transaction_id === r.transaction_id);
      return hit ? 1 + ((hit.others || []).length) : voteSeats(r).length;
    }

    function claimFormHtml() {
      return '<div class="claim-box">'
        + '<p class="caption" style="margin:0">Sign in and join this league from the app home to vote. '
        + "One account, one seat per league.</p>"
        + '<div class="claim-actions">'
        + '<button type="button" class="chip" data-app-home="1">App home</button>'
        + "</div></div>";
    }

    /** Modal overlay with the existing voteBlock side buttons and tallies. */
    function voteSheetHtml() {
      if (!voteSheetTx) return "";
      const r = tradeSide(voteSheetTx, voteSheetSeat) || tradeSide(voteSheetTx, null);
      if (!r) return "";
      return '<div class="vote-sheet" role="presentation">'
        + '<button type="button" class="vote-sheet-scrim" data-vote-sheet-close tabindex="-1"'
        + ' aria-label="Close vote panel"></button>'
        + '<div class="vote-sheet-panel" role="dialog" aria-modal="true" tabindex="-1">'
        + '<button type="button" class="vote-sheet-close" data-vote-sheet-close aria-label="Close">×</button>'
        + '<div class="vote-card">' + voteBlock(r) + "</div>"
        + "</div></div>";
    }

    /** Post-cast confirm on league home: your pick + current league tally, then X to advance. */
    function voteConfirmHtml() {
      if (!voteConfirmTx) return "";
      const r = tradeSide(voteConfirmTx, voteConfirmSeat) || tradeSide(voteConfirmTx, null);
      if (!r) return "";
      const seats = voteSeats(r);
      const v = readVotes(voteConfirmTx);
      const fairPick = isVoteFair(v.choice);
      const pickHtml = fairPick
        ? 'You marked this trade <b>Fair</b>'
        : ('You have <b>'
          + seatLabel(voteChoiceLabel(v.choice, seats), { link: false })
          + "</b> winning");
      // Team A · Fair · Team B — same order as the vote buttons.
      const rowDefs = seats.length === 2
        ? [
            { uid: seats[0].uid, label: seatLabel(seats[0].name, { link: false }) },
            { uid: VOTE_FAIR, label: "Fair" },
            { uid: seats[1].uid, label: seatLabel(seats[1].name, { link: false }) },
          ]
        : seats.map(function (s) {
            return { uid: s.uid, label: seatLabel(s.name, { link: false }) };
          });
      const rows = rowDefs.map(function (row) {
        const n = v.tally[row.uid] || 0;
        const pct = v.votes ? Math.round(n / v.votes * 100) : 0;
        const line = v.votes
          ? n + (n === 1 ? " vote" : " votes") + " · " + pct + "%"
          : "0 votes";
        return '<li class="' + (v.choice === row.uid ? "is-pick" : "") + '">'
          + "<b>" + row.label + "</b>"
          + "<span>" + esc(line) + "</span></li>";
      }).join("");
      const marks = latestTradeLeanFooterHtml(r, latestTradeLean(r));
      return '<div class="vote-sheet vote-confirm" role="presentation">'
        + '<button type="button" class="vote-sheet-scrim" data-vote-confirm-close tabindex="-1"'
        + ' aria-label="Dismiss vote confirmation"></button>'
        + '<div class="vote-sheet-panel" role="dialog" aria-modal="true" aria-label="Vote recorded" tabindex="-1">'
        + '<button type="button" class="vote-sheet-close" data-vote-confirm-close aria-label="Close">×</button>'
        + '<p class="vote-confirm-k">Vote recorded</p>'
        + '<p class="vote-confirm-pick">' + pickHtml + "</p>"
        + '<ul class="vote-confirm-tally">' + rows + "</ul>"
        + (marks ? '<div class="vote-confirm-marks">' + marks + "</div>" : "")
        + "</div></div>";
    }

    function voteBlock(r) {
      const seats = voteSeats(r);
      // N-way trades get no vote: "which side won" has no head-to-head answer across three
      // bags, and N-way is already the special case that carries no Value Adjustment.
      if (seats.length !== 2 || voteParties(r) > 2) {
        return '<div class="vote"></div>';
      }
      if (!authSeatId() || !authSession) {
        return '<div class="vote">' + claimFormHtml() + "</div>";
      }
      const v = readVotes(r.transaction_id);
      const editing = voteEditTx === r.transaction_id && v.canEdit;
      // After a ballot: one compact row (Voted · name|Fair · a–f–b). Tap to change while unlocked.
      if (v.choice && !editing) {
        const pickLab = isVoteFair(v.choice)
          ? "Fair"
          : seatLabel(voteChoiceLabel(v.choice, seats), { link: false });
        const triple = voteTallyTriple(v, seats);
        if (v.locked) {
          return '<div class="vote is-done is-locked">'
            + '<div class="vote-done" role="status" aria-label="Vote locked">'
            + '<span class="vote-done-k">Voted</span>'
            + "<b>" + pickLab + "</b>"
            + '<span class="vote-done-tally">' + triple + "</span>"
            + "</div>"
            + '<p class="caption vote-lock-note">Locked — one vote, editable for 24 hours after first cast.</p>'
            + "</div>";
        }
        return '<div class="vote is-done">'
          + '<button type="button" class="vote-done" data-vote-edit="' + esc(r.transaction_id) + '"'
          + ' aria-label="Change vote (within 24 hours)">'
          + '<span class="vote-done-k">Voted</span>'
          + "<b>" + pickLab + "</b>"
          + '<span class="vote-done-tally">' + triple + "</span>"
          + "</button></div>";
      }
      // Team A | Fair | Team B — Fair sits between the two seats.
      const opts = voteOptButtonHtml(
          r.transaction_id, seats[0].uid, seatLabel(seats[0].name, { link: false }), v, false)
        + voteOptButtonHtml(r.transaction_id, VOTE_FAIR, "Fair", v, true)
        + voteOptButtonHtml(
          r.transaction_id, seats[1].uid, seatLabel(seats[1].name, { link: false }), v, false);
      return '<div class="vote' + (v.choice ? " is-edit" : "") + '">'
        + '<div class="vote-opts">' + opts + "</div>"
        + (v.choice
          ? '<button type="button" class="linkish vote-edit-cancel" data-vote-edit-cancel="1">Done</button>'
          : "")
        + "</div>";
    }

    // Recency, not a clock: the card is named for the newest date on the tape, so there is no
    // empty state to caption and no "today" that can disagree with league.today.
    function daySides() {
      const sides = (league && league.trade_boards && league.trade_boards.sides) || [];
      let day = "";
      for (const r of sides) if (r.date > day) day = r.date;
      const by = new Map();
      for (const r of sides) {
        if (r.date !== day) continue;
        const prev = by.get(r.transaction_id);
        if (!prev || (me && r.user_id === me.user_id)) by.set(r.transaction_id, r);
      }
      return { day: day, rows: [...by.values()] };
    }

    /**
     * The championship game, as the card reads it: the two teams, their records, the final
     * score and the champion's top scorer in that game. Returns escaped HTML fragments.
     *
     * The bout is the scoreboard row -- champion, score, runner-up -- and is null for a season
     * with no usable final, which falls back to the tail pair and the old one-line caption
     * rather than rendering half a scoreboard.
     */
    function champFinalCaption(champ, rec) {
      const f = champ && champ.final;
      // The sketch reads "190 - 162.8" against true values of 189.98 and 162.82: one decimal,
      // and a trailing .0 dropped. Applied to both figures so the pair cannot read as though
      // one were rounded harder than the other. The detail screen keeps full precision.
      const rec2 = (r) => r && r.wins != null ? r.wins + "–" + r.losses : "";
      if (!f || f.champ_points == null || f.opponent_points == null) {
        return {
          bout: null,
          tail: rec.fpts_rank === 1 ? " · points race" : " · bracket",
          tailNum: "", top: "", topNum: "",
        };
      }
      // Words and figure are returned apart so the card can pin the figure and let only the
      // name ellipsise. Joined into one nowrap string, the score was at the far end of the
      // line and so was the first thing off the edge: a 33-character player name took
      // "45.0" with it, which is the one thing on this line that had to survive.
      return {
        bout: {
          champName: seatLabel(champ.name),
          champRec: rec2(rec),
          oppName: seatLabel(f.opponent),
          oppRec: rec2(f.opponent_record),
          // Winner green, loser red. A tie leaves both halves uncoloured (the gold default).
          score: f.tie
            ? scoreShort(f.champ_points) + "–" + scoreShort(f.opponent_points)
            : '<span class="bout-w">' + scoreShort(f.champ_points) + "</span>"
              + '<span class="bout-dash">–</span>'
              + '<span class="bout-l">' + scoreShort(f.opponent_points) + "</span>",
        },
        tail: " · " + (f.tie ? "tied" : "beat") + " " + seatLabel(f.opponent),
        tailNum: score1(f.champ_points) + "–" + score1(f.opponent_points),
        top: f.top && f.top.points != null ? "Top scorer · " + esc(f.top.player) : "",
        topNum: f.top && f.top.points != null ? score1(f.top.points) : "",
      };
    }

    function newsItemsLive() {
      const book = news && news.v === 1 ? news : null;
      const raw = (book && book.items) || [];
      return raw.filter((it) => !newsGone.has(it.id));
    }

    /** Compact one-line copy for the News Feed peek / pull-up rows. */

    function newsPullupBrandOffset() {
      const brand = document.querySelector("h1.brand");
      if (!brand) return 56;
      return Math.max(44, Math.ceil(brand.getBoundingClientRect().bottom));
    }

    function clearNewsPullup() {
      if (newsPullupSettleTimer) {
        clearTimeout(newsPullupSettleTimer);
        newsPullupSettleTimer = null;
      }
      newsPullupGestureLock = false;
      if (newsPullupCleanup) {
        newsPullupCleanup();
        newsPullupCleanup = null;
      }
      newsPullupOpen = false;
      document.body.classList.remove("has-news-pullup", "has-news-pullup-open");
    }

    function setNewsPullupOpen(open, opts) {
      opts = opts || {};
      const root = document.getElementById("newsPullup");
      if (!root) return;
      const wasOpen = newsPullupOpen;
      newsPullupOpen = !!open;
      // Closing always arms the click-through gate — minimize must never activate Recent Trade
      // (or any other control) that was under the expanded sheet.
      var snapHome = false;
      if (wasOpen && !newsPullupOpen) {
        swallowNewsPullupClickThrough();
        // Expand → minimize must always leave the user on league home.
        if (view !== "home") snapHome = true;
      }
      if (!opts.keepTransform) root.classList.remove("is-settling", "is-dragging");
      root.classList.toggle("is-open", newsPullupOpen);
      root.setAttribute("aria-expanded", newsPullupOpen ? "true" : "false");
      const panel = root.querySelector("[data-news-pullup-panel]");
      const peekBlock = root.querySelector("[data-news-pullup-peek-block]");
      const scrim = root.querySelector("[data-news-pullup-scrim]");
      const sheet = root.querySelector("[data-news-pullup-sheet]");
      const topChrome = root.querySelector("[data-news-pullup-top]");
      if (topChrome) {
        topChrome.setAttribute(
          "aria-label",
          newsPullupOpen
            ? "Minimize News Feed — tap or drag down"
            : "News Feed — drag up to open, tap title to expand"
        );
      }
      if (panel) panel.hidden = !newsPullupOpen;
      if (peekBlock) peekBlock.hidden = newsPullupOpen;
      // Keep scrim in DOM (transparent) briefly after close so it can still catch hits while
      // the sheet animates down — hidden is applied by the click-guard timeout path too.
      if (scrim) {
        if (newsPullupOpen) {
          scrim.hidden = false;
          scrim.style.opacity = "";
        } else if (wasOpen) {
          scrim.hidden = false;
          scrim.style.opacity = "0";
          setTimeout(function () {
            if (!newsPullupOpen && scrim) {
              scrim.hidden = true;
              scrim.style.opacity = "";
            }
          }, 400);
        } else {
          scrim.hidden = true;
          scrim.style.opacity = "";
        }
      }
      document.body.classList.toggle("has-news-pullup-open", newsPullupOpen);
      if (sheet && !opts.keepTransform) {
        sheet.style.transform = "";
        sheet.style.transition = "";
        sheet.style.height = "";
        sheet.style.maxHeight = "";
        sheet.setAttribute("aria-modal", newsPullupOpen ? "true" : "false");
      } else if (sheet) {
        sheet.setAttribute("aria-modal", newsPullupOpen ? "true" : "false");
      }
      if (newsPullupOpen && panel && !opts.keepScroll) panel.scrollTop = 0;
      if (snapHome) {
        view = "home";
        openId = null;
        tradeSeat = null;
        partnerName = null;
        openPick = null;
        openDraft = null;
        markOpen = null;
        lensOpen = false;
        titleYear = null;
        voteSheetTx = null;
        voteSheetSeat = null;
        voteConfirmTx = null;
        voteConfirmSeat = null;
        voteEditTx = null;
        focusNext = null;
        render();
      }
    }

    /**
     * Wire the bottom News Feed pull-up: drag/flick open & close, tap top/scrim to close,
     * tap peek to open. Sheet expands up to just under the Chuckle Fantasy brand.
     * Always transform-only (full-height sheet + translateY). Settle animates from the
     * finger's release position — never snap-jump. Mid-gesture re-render keeps listeners.
     */
    function armNewsPullup() {
      const root = document.getElementById("newsPullup");
      // Mid-gesture / mid-settle: keep existing pointer listeners on the *same* DOM node.
      // Re-arming would tear down capture mid-swipe. If render() remounted the sheet, the
      // old listeners are dead — drop the lock and re-wire onto the new root.
      if (newsPullupGestureLock && root && newsPullupArmedRoot === root) return;
      if (newsPullupGestureLock && root && newsPullupArmedRoot !== root) {
        newsPullupGestureLock = false;
        if (newsPullupSettleTimer) {
          clearTimeout(newsPullupSettleTimer);
          newsPullupSettleTimer = null;
        }
      }
      const wasOpen = newsPullupOpen;
      if (newsPullupCleanup) {
        newsPullupCleanup();
        newsPullupCleanup = null;
      }
      if (!root) {
        newsPullupArmedRoot = null;
        return;
      }
      document.body.classList.add("has-news-pullup");
      newsPullupArmedRoot = root;
      const sheet = root.querySelector("[data-news-pullup-sheet]");
      const top = root.querySelector("[data-news-pullup-top]");
      const peek = root.querySelector("[data-news-pullup-peek]");
      const scrim = root.querySelector("[data-news-pullup-scrim]");
      if (!sheet || !top) return;

      const applyBrand = function () {
        root.style.setProperty("--brand-offset", newsPullupBrandOffset() + "px");
      };
      applyBrand();
      setNewsPullupOpen(wasOpen);

      const PEAK_FALLBACK = 100;
      const TAP_SLOP = 12;
      const SHORT_SWIPE = 28;
      const FLICK_V = 0.35;
      const SETTLE_MS = 280;
      let drag = null;
      let suppressChromeClickUntil = 0;
      let settleGen = 0;
      const cleanups = [];

      function peekH() {
        const raw = getComputedStyle(root).getPropertyValue("--news-pullup-peek").trim();
        const n = parseFloat(raw);
        return Number.isFinite(n) && n > 0 ? n : PEAK_FALLBACK;
      }
      function openSheetH() {
        const raw = getComputedStyle(root).getPropertyValue("--brand-offset").trim();
        const brand = parseFloat(raw);
        const b = Number.isFinite(brand) ? brand : 56;
        return Math.max(0, root.clientHeight - b);
      }
      /** Collapsed translateY must match CSS: calc(100% - peek) of the sheet. */
      function maxTy() {
        return Math.max(0, openSheetH() - peekH());
      }
      function clamp(n, a, b) {
        return Math.max(a, Math.min(b, n));
      }
      function readTy() {
        const inline = sheet.style.transform;
        if (inline && inline.indexOf("translateY") !== -1) {
          const m = inline.match(/translateY((-?[d.]+)px)/);
          if (m) {
            const n = parseFloat(m[1]);
            if (Number.isFinite(n)) return n;
          }
        }
        const t = getComputedStyle(sheet).transform;
        if (!t || t === "none") return newsPullupOpen ? 0 : maxTy();
        const nums = t.match(/matrix(?:3d)?(([^)]+))/);
        if (!nums) return newsPullupOpen ? 0 : maxTy();
        const parts = nums[1].split(",").map(function (x) { return parseFloat(x.trim()); });
        if (parts.length === 6) return parts[5] || 0;
        if (parts.length === 16) return parts[13] || 0;
        return newsPullupOpen ? 0 : maxTy();
      }
      function clearSettleTimer() {
        if (newsPullupSettleTimer) {
          clearTimeout(newsPullupSettleTimer);
          newsPullupSettleTimer = null;
        }
      }
      function finishSettle(open, gen) {
        // Consume this settle generation so transitionend + timeout cannot double-run,
        // and so a newer drag/settle cannot be clobbered by a stale finisher.
        if (gen !== settleGen) return;
        settleGen += 1;
        clearSettleTimer();
        root.classList.remove("is-settling", "is-dragging");
        // Freeze motion, sync is-open FIRST, then drop the inline translate.
        // Clearing transform while still .is-open made close settle flash to 0 then
        // jump to peek — the main iPhone “snap / jump” glitch on minimize.
        sheet.style.transition = "none";
        newsPullupGestureLock = false;
        setNewsPullupOpen(open, { keepTransform: true });
        sheet.style.transform = "";
        sheet.style.height = "";
        sheet.style.maxHeight = "";
        void sheet.offsetHeight;
        sheet.style.transition = "";
      }

      function settleTo(open) {
        clearSettleTimer();
        const gen = ++settleGen;
        newsPullupGestureLock = true;
        applyBrand();
        // Close only: arm the click-through shield AFTER the gesture ends. Doing this on
        // pointerdown (while open) parked a full-viewport guard over the sheet and ate
        // pointermove/up on iPhone — swipe/tap minimize never finished.
        if (!open) swallowNewsPullupClickThrough();
        else clearNewsPullupClickGuard();
        const from = readTy();
        const to = open ? 0 : maxTy();
        // Opening: show the feed panel immediately so content is visible while rising.
        if (open && !newsPullupOpen) {
          setNewsPullupOpen(true, { keepTransform: true, keepScroll: true });
          sheet.style.transform = "translateY(" + from + "px)";
        }

        // panel/scrim do not vanish mid-slide (that used to look like a snap).
        const reduceMotion = window.matchMedia
          && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion || Math.abs(from - to) < 1) {
          sheet.style.transition = "none";
          sheet.style.transform = "translateY(" + to + "px)";
          finishSettle(open, gen);
          return;
        }
        root.classList.add("is-settling");
        root.classList.remove("is-dragging");
        sheet.style.transition = "none";
        sheet.style.transform = "translateY(" + from + "px)";
        void sheet.offsetHeight;
        sheet.style.transition = "transform " + SETTLE_MS + "ms cubic-bezier(0.22, 1, 0.36, 1)";
        sheet.style.transform = "translateY(" + to + "px)";
        function onEnd(ev) {
          if (ev && ev.target !== sheet) return;
          if (ev && ev.propertyName && ev.propertyName !== "transform") return;
          sheet.removeEventListener("transitionend", onEnd);
          finishSettle(open, gen);
        }
        sheet.addEventListener("transitionend", onEnd);
        newsPullupSettleTimer = setTimeout(function () {
          try { sheet.removeEventListener("transitionend", onEnd); } catch (e) {}
          finishSettle(open, gen);
        }, SETTLE_MS + 80);
      }
      function endDrag(e) {
        if (!drag || (e && e.pointerId != null && e.pointerId !== drag.id)) return;
        const fromOpen = drag.fromOpen;
        const dy = (e && e.clientY != null ? e.clientY : drag.lastY) - drag.startY;
        const wasTap = !drag.moved;
        const flickOpen = drag.vel < -FLICK_V;
        const flickClose = drag.vel > FLICK_V;
        const ty = readTy();
        const limit = Math.max(1, maxTy());
        const captureEl = drag.el;
        const pid = drag.id;
        drag = null;
        root.classList.remove("is-dragging");
        try {
          if (captureEl && pid != null) captureEl.releasePointerCapture(pid);
        } catch (err) {}
        suppressChromeClickUntil = Date.now() + 450;
        let nextOpen;
        if (wasTap) {
          if (e && e.target && e.target.closest("a.news-hero-link")) {
            newsPullupGestureLock = false;
            sheet.style.transition = "";
            sheet.style.transform = "";
            return;
          }
          if (e && e.target && e.target.closest("[data-news-del]")) {
            newsPullupGestureLock = false;
            sheet.style.transition = "";
            sheet.style.transform = "";
            return;
          }
          nextOpen = !fromOpen;
        } else if (fromOpen) {
          // From open: close on downward flick, short drag down, or past ~25% closed.
          nextOpen = !(flickClose || dy > SHORT_SWIPE || ty > limit * 0.25);
        } else {
          // From collapsed: open on upward flick, short drag up, or past ~25% open.
          nextOpen = !!(flickOpen || dy < -SHORT_SWIPE || ty < limit * 0.75);
        }
        settleTo(nextOpen);
      }
      function onPointerDown(e) {
        if (e.button != null && e.button !== 0) return;
        if (drag) return;
        if (e.target.closest("a.news-hero-link")) return;
        if (e.target.closest("[data-news-del]")) return;
        if (e.target.closest("[data-news-cuff]")) return;
        // Expanded panel scrolls on its own — only chrome/peek start a sheet drag.
        if (newsPullupOpen && e.target.closest("[data-news-pullup-panel]")) return;
        // Do NOT swallowNewsPullupClickThrough() here — that inserts a full-screen guard
        // above the sheet and blocks pointermove/up on iPhone (collapse never completes).
        clearSettleTimer();
        // Invalidate any in-flight settleTo finisher (transitionend/timeout) before we drag.
        settleGen += 1;
        root.classList.remove("is-settling");
        sheet.style.transition = "none";
        applyBrand();
        // Prefer live computed translate so interrupting a settle does not jump.
        const ty = readTy();
        drag = {
          id: e.pointerId,
          el: e.currentTarget,
          startY: e.clientY,
          startX: e.clientX,
          originTy: ty,
          lastY: e.clientY,
          lastT: performance.now(),
          vel: 0,
          moved: false,
          fromOpen: newsPullupOpen,
        };
        newsPullupGestureLock = true;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        root.classList.add("is-dragging");
        sheet.style.transform = "translateY(" + ty + "px)";
        // Touch: block page scroll under the sheet. Mouse: allow click fallback.
        if (e.pointerType === "touch") e.preventDefault();
      }
      function onPointerMove(e) {
        if (!drag || e.pointerId !== drag.id) return;
        const now = performance.now();
        const dy = e.clientY - drag.startY;
        const dx = e.clientX - drag.startX;
        const dt = Math.max(1, now - drag.lastT);
        drag.vel = (e.clientY - drag.lastY) / dt;
        drag.lastY = e.clientY;
        drag.lastT = now;
        // iPhone finger jitter is often a few px — keep taps feeling like taps.
        if (Math.abs(dy) > TAP_SLOP || Math.abs(dx) > TAP_SLOP) drag.moved = true;
        sheet.style.transform = "translateY(" + clamp(drag.originTy + dy, 0, maxTy()) + "px)";
        if (e.pointerType === "touch") e.preventDefault();
      }
      function onLostCapture(e) {
        if (!drag || e.pointerId !== drag.id) return;
        endDrag(e);
      }
      function onChromeClick(e) {
        if (Date.now() < suppressChromeClickUntil) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (e.target.closest("a.news-hero-link")) return;
        if (e.target.closest("[data-news-del]")) return;
        if (e.target.closest("[data-news-pullup-panel]")) return;
        suppressChromeClickUntil = Date.now() + 450;
        e.preventDefault();
        e.stopPropagation();
        settleTo(!newsPullupOpen);
      }
      function onScrimPointer(e) {
        if (e.button != null && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        settleTo(false);
      }
      function onPeekKey(e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        settleTo(!newsPullupOpen);
      }
      function onTopKey(e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        if (newsPullupOpen) settleTo(false);
        else settleTo(true);
      }
      function onKey(e) {
        if (e.key === "Escape" && newsPullupOpen) {
          e.preventDefault();
          settleTo(false);
        }
      }
