    function clockName() {
      return ((WINDOWS.find((w) => w[0] === lens) || [])[1] || "");
    }

    function livedHint(shown, all, noun) {
      if (!all) return "";
      const one = noun || "deal";
      const many = one + "s";
      if (lens === "t0" || lens === "all" || shown === all) return shown + " " + (shown === 1 ? one : many);
      const span = { y1: "1 season", y2: "2 seasons", y3: "3 seasons" }[lens] || clockName();
      return shown + " of " + all + " lived " + span;
    }

    function scoreOpt(row) {
      const active = lensPicker === "run" ? runLens : lens;
      // Title-only rows keep the portal short; longer copy stays on title/aria for hover & SR.
      return '<button type="button" class="score-opt' + (active === row[0] ? " on" : "") + '" data-lens="' + row[0] + '"'
        + ' title="' + esc(row[2] || row[1]) + '" aria-label="' + esc(row[1]) + '">'
        + "<b>" + esc(row[1]) + "</b></button>";
    }

    /**
     * The two screens the clock cannot move, and therefore the two the header control hides on.
     *
     * Champions Path reads no clock at all: renderTitles() never calls lens, chipLived() or
     * clockName(), so every figure on it is a finals score. The Drafts tab pins lens to "all"
     * for the whole of its render and puts it back afterwards, so every pick is graded from
     * accept day to today whatever the control says.
     *
     * Showing it there would leave a control on screen that visibly does nothing, which is the
     * defect this app has already removed once -- the ticker shipped "Most active" and "Least
     * active" as buttons carrying an empty destination, and every tap on them was ignored. The
     * set of screens the clock is offered on is therefore exactly the set it was offered on
     * before it moved: league home, a seat's home, both trades lists, partners and the
     * full-screen trade. The move changed where the control lives, not where it applies.
     *
     * The selected window survives a trip through either screen -- lens is state, not markup --
     * so leaving Drafts brings the control back reading whatever it read on the way in.
     */
    function lensApplies() {
      return view !== "titles" && view !== "drafts";
    }

    /**
     * Paint compact chip score triggers and the scoreAs portal. Triggers live in app markup;
     * the menu portals outside so it is not destroyed mid-click. Changing the window calls
     * render() because that is what moves the figures.
     */

    /**
     * Compact score-window control for chips that show trade / player values.
     * Shared global lens state -- any chip updates the same clock; menu portals via #scoreAs.
     */
    function chipLensIcon() {
      return '<svg class="chip-lens-ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">'
        + '<circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle>'
        + '<path d="M8 4.75V8l2.4 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>'
        + "</svg>";
    }

    function chipLensHtml(opts) {
      if (!lensApplies()) return "";
      const inline = !!(opts && opts.inline);
      const name = clockName();
      return '<span class="chip-lens' + (inline ? " is-inline" : "") + '">'
        + '<button type="button" class="chip-lens-btn" data-score="1"'
        + ' aria-label="Score window: ' + esc(name) + '" aria-haspopup="true" aria-expanded="false"'
        + ' title="' + esc(name) + '">'
        + chipLensIcon() + "</button></span>";
    }

    function paintLens() {
      const panel = document.getElementById("scoreAs");
      const btns = document.querySelectorAll("button.chip-lens-btn[data-score]");
      const runBtns = document.querySelectorAll("button.chip-lens-btn[data-run-lens]");
      if (!panel) return;
      if (!lensApplies() || (!btns.length && !runBtns.length)) {
        lensOpen = false;
        lensPicker = "trade";
        panel.hidden = true;
        panel.innerHTML = "";
        return;
      }
      const active = lensPicker === "run" ? runLens : lens;
      const activeName = (WINDOWS.find((w) => w[0] === active) || [])[1] || "";
      const tradeName = (WINDOWS.find((w) => w[0] === lens) || [])[1] || "";
      const runName = (WINDOWS.find((w) => w[0] === runLens) || [])[1] || "";
      for (const btn of btns) {
        btn.className = "chip-lens-btn" + (lensPicker === "trade" && (lens !== "all" || lensOpen) ? " on" : "");
        btn.setAttribute("aria-label", "Score window: " + tradeName);
        btn.setAttribute("title", tradeName);
        btn.setAttribute("aria-expanded", lensOpen && lensPicker === "trade" ? "true" : "false");
        btn.innerHTML = chipLensIcon()
          + (lens !== "all" ? '<span class="dot" aria-hidden="true"></span>' : "");
      }
      for (const btn of runBtns) {
        btn.className = "chip-lens-btn" + (lensPicker === "run" && (runLens !== "all" || lensOpen) ? " on" : "");
        btn.setAttribute("aria-label", "Ahead or behind window: " + runName);
        btn.setAttribute("title", runName);
        btn.setAttribute("aria-expanded", lensOpen && lensPicker === "run" ? "true" : "false");
        btn.innerHTML = chipLensIcon()
          + (runLens !== "all" ? '<span class="dot" aria-hidden="true"></span>' : "");
      }
      panel.hidden = !lensOpen;
      panel.innerHTML = lensOpen ? WINDOWS.map(scoreOpt).join("") : "";
      if (lensOpen) {
        const anchor = (lensAnchorId && document.querySelector('[data-lens-anchor="' + lensAnchorId + '"]'))
          || (lensPicker === "run" ? runBtns[0] : btns[0]);
        if (anchor) positionScoreAs(anchor);
      }
    }

    let lensAnchorId = 0;
    let lensAnchorSeq = 0;

    function positionScoreAs(btn) {
      const panel = document.getElementById("scoreAs");
      if (!panel || !btn) return;
      const r = btn.getBoundingClientRect();
      const width = Math.min(280, window.innerWidth - 32);
      let left = Math.min(r.right - width, window.innerWidth - 16 - width);
      left = Math.max(16, left);
      let top = r.bottom + 4;
      panel.style.left = left + "px";
      panel.style.top = top + "px";
      // Flip above if near bottom of viewport.
      requestAnimationFrame(() => {
        const pr = panel.getBoundingClientRect();
        if (pr.bottom > window.innerHeight - 8) {
          panel.style.top = Math.max(8, r.top - pr.height - 4) + "px";
        }
      });
    }

    /**
     * Screen-local filter row (Trades year/team/sort, Drafts rounds, league tape filters).
     * No score clock here — each trade chip already mounts its own chipLensHtml().
     */
    function filterRow(left) {
      return '<div class="lens-row"><div class="lens-row-left">' + left + "</div></div>";
    }

    function renderDrafts() {
      const prev = lens;
      lens = "all";
      const raw = []
        .concat((data.drafts && data.drafts.rookie) || [], draftStartup ? (data.drafts && data.drafts.startup) || [] : [])
        .filter((p) => p.startup ? draftStartup : !!draftRounds[p.round]);
      let list = raw.filter((p) => chipLived(p.as_of));
      list = list.slice().sort((a, b) => {
        const date = Number(a.season) - Number(b.season) || (a.pick_no || 0) - (b.pick_no || 0);
        if (draftSort === "old") return date;
        if (draftSort === "gain" || draftSort === "loss") {
          const da = pickDelta(a), db = pickDelta(b);
          if (da == null && db == null) return -date;
          if (da == null) return 1;
          if (db == null) return -1;
          return draftSort === "gain" ? db - da : da - db;
        }
        return -date;
      });
      const graded = list.map(pickDelta).filter((d) => d != null);
      const avg = graded.length ? graded.reduce((a, b) => a + b, 0) / graded.length : null;
      const filtered = draftSort !== "new" || draftStartup || !draftRounds[1] || !draftRounds[2] || !draftRounds[3] || !draftRounds[4];
      const rounds = [["1", "1st round"], ["2", "2nd round"], ["3", "3rd round"], ["4", "4th round"]];
      const sorts = [
        ["new", "Newest"],
        ["old", "Oldest"],
        ["gain", "Value high to low"],
        ["loss", "Value low to high"],
      ];
      const draftBtn = '<button type="button" class="filter-btn' + (filtered || draftFilterOpen ? " on" : "") + '" data-dfilter="1" aria-label="Filter drafts" aria-expanded="' + (draftFilterOpen ? "true" : "false") + '">'
        + '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 5h16l-6.2 7.2V19l-3.6 1.8v-8.6L4 5z"/></svg>'
        + (filtered ? '<span class="dot"></span>' : "")
        + "</button>"
        + '<div class="caption">' + tapeMargin(avg) + " / pick"
        + " · " + graded.length + " graded · " + esc(livedHint(list.length, raw.length, "pick")) + "</div>";
      const html = filterRow(draftBtn)
        + (draftFilterOpen
          ? '<div class="filter-panel" id="draftFilters">'
            + '<div class="filter-h">Date</div>'
            + sorts.slice(0, 2).map((s) => '<label data-dsort="' + s[0] + '"><input type="radio" name="dsort"' + (draftSort === s[0] ? " checked" : "") + "> " + s[1] + "</label>").join("")
            + '<div class="filter-h">Value</div>'
            + sorts.slice(2).map((s) => '<label data-dsort="' + s[0] + '"><input type="radio" name="dsort"' + (draftSort === s[0] ? " checked" : "") + "> " + s[1] + "</label>").join("")
            + '<hr class="rule">'
            + rounds.map((r) => '<label data-dround="' + r[0] + '"><input type="checkbox"' + (draftRounds[r[0]] ? " checked" : "") + "> " + r[1] + "</label>").join("")
            + '<hr class="rule">'
            + '<label data-dstartup="1"><input type="checkbox"' + (draftStartup ? " checked" : "") + "> Include startup picks</label>"
            + "</div>"
          : "")
        + (list.length ? "" : '<p class="caption">No graded picks with these filters. Widen the rounds, or include startup picks.</p>')
        + list.map((p) => pickRow(p)).join("");
      lens = prev;
      return html;
    }

    function renderPartners() {
      const list = (data && data.partners) || [];
      // One per-partner number, scored once. Sorting used to call it twice per comparison.
      const scored = list.map((p) => ({ p: p, w: partnerPer(data, p.name) }))
        .sort((a, b) => (b.w.per ?? -1e9) - (a.w.per ?? -1e9));
      const rows = scored.map((row) => {
        const p = row.p, per = row.w.per;
        return '<div class="row' + (partnerName === p.name ? " open" : "") + '" role="button" tabindex="0" data-partner="' + esc(p.name) + '">'
          + '<div class="row-top"><div><div class="names">' + seatLabel(p.name) + "</div>"
          + '<div class="date">' + p.complete + " complete · " + p.trades + " deals · "
          + '<span class="' + gradeCls(row.w.grade) + '">' + gradeLabel(row.w.grade) + "</span></div></div>"
          + '<div class="margin">' + tapeMargin(per) + "</div></div></div>";
      }).join("");
      let detail = "";
      if (partnerName) {
        const p = list.find((x) => x.name === partnerName);
        const deals = ((data && data.trades) || [])
          .filter((t) => (t.others || []).length === 1 && t.others[0] === partnerName && chipLived(t.date));
        detail = p
          ? "<h2>" + seatLabel(p.name) + "</h2>"
            + (deals.length
              ? '<div class="trades-feed">' + deals.map((t) => seatTradeFeedCardHtml(t)).join("") + "</div>"
              : '<p class="caption">No deal with ' + seatLabel(p.name) + " has lived " + esc(clockName()) + " yet.</p>")
          : "";
      }
      const empty = list.length ? "" : '<p class="caption">No trade partners yet on this seat.</p>';
      return empty + rows + detail;
    }

    function render() {
      ledgerDropComposeIfLeft();
      if (ledgerComposeStayPut()) {
        const live = document.querySelector("#app [data-ledger-wager-form], #app [data-ledger-counter-form]");
        ledgerCaptureCompose(live, { merge: true });
        ledgerHydrateCompose(live);
        return;
      }
      ledgerParkCompose();
      const app = document.getElementById("app");
      // Multi-league app shell — before the per-league dashboard.
      if (appScreen === "gate" || appScreen === "home" || appScreen === "create"
          || appScreen === "invites" || appScreen === "redeem" || appScreen === "inviteConfirm"
          || appScreen === "settings" || appScreen === "profile") {
        const keep = focusSelector(document.activeElement);
        const navigated = focusNext !== null;
        app.innerHTML = appScreen === "gate" ? renderAppGate()
          : appScreen === "create" ? renderCreateLeague()
          : appScreen === "invites" ? renderInvites()
          : appScreen === "redeem" ? renderRedeemInvite()
          : appScreen === "inviteConfirm" ? renderInviteConfirm()
          : appScreen === "settings" ? renderSettings()
          : appScreen === "profile" ? renderProfile()
          : renderAppHome();
        paintSettingsBtn();
        paintBrandHome();
        if (appScreen === "settings" && settingsTab === "profile") {
          queueMicrotask(() => paintProfileCrop());
        }
        if (appScreen === "profile") queueMicrotask(() => paintProfileCrop());
        const land = focusNext ? app.querySelector(focusNext) : null;
        focusNext = null;
        if (land) land.focus({ preventScroll: true });
        else if (navigated) app.focus({ preventScroll: true });
        else if (keep) {
          const back = app.querySelector(keep);
          if (back) back.focus({ preventScroll: true });
        }
        if (navigated) window.scrollTo(0, 0);
        paintLeagueSub();
        paintBottomNav();
        return;
      }
      if (appScreen === "dash" && activeLeague && activeLeague.status && activeLeague.status !== "ready"
          && activeLeague.sleeper_league_id !== CUCKLE_LEAGUE_ID) {
        // Non-Cuckle leagues without a ready sync get the pending screen, not a broken meter.
        const hasBook = !!(league && members);
        if (!hasBook) {
          paintSettingsBtn();
          paintBrandHome();
          paintLeagueSub();
          paintBottomNav();
          app.innerHTML = renderPendingLeague();
          return;
        }
      }
      paintSettingsBtn();
      paintBrandHome();
      paintLeagueSub();
      if (view !== "home" && VIEWS.indexOf(view) < 0) view = "home";
      if (!me && SEATLESS.indexOf(view) < 0) view = "home";
      // Legacy full-screen doors → in-place league-home tabs.
      if (!me && (view === "teams" || view === "ledger" || view === "datasets")) {
        homeTab = view === "datasets" ? "history" : view;
        view = "home";
      }
      // The League Data Sets dropdown exists on league home and nowhere else, so an open one
      // cannot survive a navigation off it. Done here rather than in each of the six functions
      // that leave, so the next one added cannot forget. Same condition as the renderer below.
      if (!(view === "home" && !(me && data))) dsOpen = false;
      // A full-screen trade is not a section of a seat, so the four tabs do not frame it.
      const tabs = me && view !== "titles" && view !== "trade" && view !== "datasets" && view !== "ledger" ? ["home", "trades", "partners", "drafts"] : [];
      // The four tabs are sections of one manager's page and none of them names that manager,
      // so this does -- once, above the row, on every one of them. It doubles as the screen
      // heading those four screens never had: focusNext = ".screen-h" now lands on the name of
      // the seat you just took instead of falling through to the panel, and the outline no
      // longer skips from the brand h1 straight to an h2 inside the body. Gated on tabs, so
      // Champions Path and a full-screen trade -- both league-wide, both already titled -- are
      // untouched, and league home with no seat gains nothing.
      const seatName = tabs.length
        ? '<h2 class="screen-h seat-h" tabindex="-1"><span class="sr-only">Team: </span>'
          + seatLabel(me.name) + "</h2>"
        : "";
      const syncNote = (activeLeague && activeLeague.status && activeLeague.status !== "ready"
        && activeLeague.sleeper_league_id !== CUCKLE_LEAGUE_ID)
        ? '<div class="sync-banner">Meter sync still pending for this league. Showing what is available.</div>'
        : "";
      const nav = (tabs.length
        ? '<div class="nav" role="tablist" aria-label="Sections">'
          + tabs.map((v) =>
            '<button type="button" role="tab" aria-selected="' + (view === v ? "true" : "false") + '"'
            + ' tabindex="' + (view === v ? "0" : "-1") + '"'
            + ' class="tab' + (view === v ? " on" : "") + '" data-view="' + v + '">' + v + "</button>"
          ).join("")
          + "</div>"
        : "");
      const body = view === "home" ? renderHome()
        // ?view=trades means this seat's Trades tab when a seat is set, and the league-wide
        // list of every trade when none is.
        : view === "trades" ? (me && data ? renderTrades() : renderLeagueTrades())
        : view === "trade" ? renderTradeScreen()
        : view === "partners" ? renderPartners()
        : view === "drafts" ? renderDrafts()
        : view === "titles" ? renderTitles()
        : view === "ledger" ? renderLedger()
        : view === "account" ? renderAccountPage()
        : view === "teams" ? renderTeamsPage()
        : view === "news" ? renderNewsPage()
        : view === "datasets" ? renderDataSetsPage()
        : view === "draftdata" ? renderDraftDataPage()
        : view === "cuffs" ? renderCuffsPage()
        : view === "calc" ? renderCalc()
        : view === "cosmetics" ? renderCosmetics()
        : renderLeagueHome();
      // render() replaces the whole subtree, so expanding trade #40 used to drop focus to
      // <body> and lose the keyboard's place. Re-find the same control by its data-* attrs.
      const keep = focusSelector(document.activeElement);
      // The news feed is its own scroll container, and innerHTML resets it to the top. Without
      // this, any re-render (a vote settling, a seat file arriving) throws the reader back to
      // the first row -- the rebuild is invisible to them, so it reads as the page jumping for
      // no reason.
      const newsBox = app.querySelector(".news-box");
      const newsScroll = newsBox ? newsBox.scrollTop : 0;
      app.innerHTML = syncNote + seatName + nav + body + voteSheetHtml() + voteConfirmHtml();
      ledgerUnparkCompose();
      ledgerRememberCompose();
      document.body.classList.toggle("has-vote-sheet", !!(voteSheetTx || voteConfirmTx));
      if (newsScroll) {
        const box = app.querySelector(".news-box");
        if (box) box.scrollTop = newsScroll;
      }
      // A new screen puts focus on its own heading and starts at the top, so a keyboard or a
      // screen reader lands on the new content instead of holding the old screen's place.
      const navigated = focusNext !== null;
      const land = focusNext ? app.querySelector(focusNext) : null;
      focusNext = null;
      if (land) land.focus({ preventScroll: true });
      else if (voteConfirmTx) {
        const sheet = app.querySelector(".vote-confirm .vote-sheet-panel");
        if (sheet) sheet.focus({ preventScroll: true });
      }
      else if (voteSheetTx) {
        const sheet = app.querySelector(".vote-sheet-panel");
        if (sheet) sheet.focus({ preventScroll: true });
      }
      // League home leads with cards rather than a title, so there is no heading to land on.
      // The panel itself is the defined start of the new content. A seat always has one now.
      else if (navigated) app.focus({ preventScroll: true });
      else if (keep) {
        const back = app.querySelector(keep);
        if (back) back.focus({ preventScroll: true });
      }
      if (navigated) window.scrollTo(0, 0);
      // After the body, not before: renderDrafts() pins lens to "all" for its own render and
      // restores it on the way out, so the trigger must be painted from the settled value.
      paintLens();
      paintLeagueSub();
      paintBottomNav();
      syncUrl();
      rememberHomeTab();
      ledgerPtrSyncArmed();
      armNewsPullup();
      if (typeof syncDesignIphoneStage === "function") syncDesignIphoneStage();
    }

    /** A selector that survives an innerHTML rebuild: the tag plus every data-* attribute. */
    function focusSelector(el) {
      if (!el || !el.closest || !el.closest("#app")) return null;
      // A screen heading carries no data-* of its own, and a screen usually has a second render
      // behind it — the seat file arriving, or a vote settling. Without this, that render threw
      // focus back to <body> a moment after a navigation had just placed it.
      if (el.classList && el.classList.contains("screen-h")) return ".screen-h";
      const parts = [...el.attributes]
        .filter((a) => a.name.startsWith("data-"))
        .map((a) => "[" + a.name + '="' + a.value.replace(/["\\]/g, "\\$&") + '"]');
      return parts.length ? el.tagName.toLowerCase() + parts.join("") : null;
    }

        if (v === "__pick__") return;
        if (!v) {
          pickFilterOwner = "";
          pickFilterOwnerMode = null;
          pickFilterOwnerAny = true;
          pickFilterOpen = false;
          pickFilterStep = null;
        } else {
          pickFilterOwner = v;
          pickFilterOwnerAny = false;
          pickFilterOwnerMode = null;
          pickFilterOpen = true;
          pickFilterStep = "owner";
        }
        pickIntelOpen = null;
        render();
        return;
      }
      const seatYearLab = e.target.closest("[data-seat-year]");
      if (seatYearLab) {
        year = e.target.checked ? seatYearLab.dataset.seatYear : "all";
        tapeLimit = 20;
        yearFilterOpen = true;
        render();
        return;
      }
      const seatTeamLab = e.target.closest("[data-seat-team]");
      if (seatTeamLab) {
        seatTradeTeam = e.target.checked ? seatTeamLab.dataset.seatTeam : "all";
        tapeLimit = 20;
        yearFilterOpen = true;
        render();
        return;
      }
      const seatSortLab = e.target.closest("[data-seat-sort]");
      if (seatSortLab) {
        seatTradeSort = seatSortLab.dataset.seatSort || "new";
        tapeLimit = 20;
        yearFilterOpen = true;
        render();
        return;
      }
      const sortLab = e.target.closest("[data-dsort]");
      if (sortLab) {
        draftSort = sortLab.dataset.dsort;
        draftFilterOpen = true;
        render();
        return;
      }
      const roundLab = e.target.closest("[data-dround]");
      if (roundLab) {
        draftRounds[roundLab.dataset.dround] = e.target.checked;
        draftFilterOpen = true;
        render();
        return;
      }
      if (e.target.closest("[data-dstartup]")) {
        draftStartup = e.target.checked;
        draftFilterOpen = true;
        render();
      }
    });
    document.getElementById("app").addEventListener("focusin", (e) => {
      const ta = e.target && e.target.closest && e.target.closest("textarea[data-ledger-desc]");
      if (ta) ledgerPaintDescBox(ta.form || ta.closest("form"));
    });
    document.getElementById("app").addEventListener("scroll", (e) => {
      const ta = e.target && e.target.closest && e.target.closest("textarea[data-ledger-desc]");
      if (!ta) return;
      const hi = (ta.form || ta.closest("form") || document).querySelector("[data-ledger-desc-hi]");
      if (hi) hi.scrollTop = ta.scrollTop;
    }, true);
    document.getElementById("app").addEventListener("pointerdown", (e) => {
      if (!ledgerComposeOpen()) return;
      const form = document.querySelector("#app [data-ledger-wager-form], #app [data-ledger-counter-form]");
      if (form) ledgerCaptureCompose(form, { merge: false });
    }, true);
    document.getElementById("app").addEventListener("focusout", (e) => {
      const field = e.target && e.target.closest && e.target.closest("[data-ledger-wager-live]");
      if (!field) return;
      const form = field.form || field.closest("form");
      if (!form) return;
      ledgerCaptureCompose(form, { merge: true });
      ledgerPaintDescBox(form, { forceClose: true });
      ledgerHydrateCompose(form);
    }, true);
    document.getElementById("app").addEventListener("change", (e) => {
      const sendSel = e.target && e.target.closest && e.target.closest("[data-ledger-send-select]");
      if (sendSel) {
        const form = sendSel.closest("form");
        if (form) ledgerOnSendTeamPicked(form, sendSel);
        return;
      }
      const wagerLive = e.target && e.target.closest && e.target.closest("[data-ledger-wager-live]");
      if (wagerLive) {
        const form = wagerLive.form || wagerLive.closest("form");
        if (wagerLive.getAttribute("name") === "clock_kind") {
          form.setAttribute("data-ledger-clock-manual", "1");
          ledgerApplyClockKind(form, wagerLive.value);
        }
        ledgerCaptureCompose(form, { merge: true });
        ledgerHydrateCompose(form);
        ledgerPaintWagerPreview(form, { capture: false });
        return;
      }
      const ledgerFeedSel = e.target.closest("select[data-ledger-feed]");
      if (ledgerFeedSel) {
        ledgerFeed = ledgerFeedSel.value || "live";
        render();
        return;
      }
      const cuffOwnerSel = e.target.closest("[data-cuff-owner]");
      if (cuffOwnerSel) {
        cuffFilterOwner = cuffOwnerSel.value || "";
        if (cuffFilterOwner) cuffFilterMine = false;
        render();
        return;
      }
      const calcSeatSel = e.target.closest("[data-calc-seat]");
      if (calcSeatSel) {
        const side = calcSeatSel.getAttribute("data-calc-seat");
        if (side === "b") { calcSeatB = calcSeatSel.value || ""; calcLegsB = []; calcFilterB = ""; }
        else { calcSeatA = calcSeatSel.value || ""; calcLegsA = []; calcFilterA = ""; }
        calcSide = side === "b" ? "b" : "a";
        render();
        return;
      }
      if (e.target && e.target.id === "profileFile" && e.target.files && e.target.files[0]) {
        beginProfileCrop(e.target.files[0]);
        e.target.value = "";
        return;
      }
    });
    document.getElementById("app").addEventListener("input", (e) => {
      const wagerLive = e.target && e.target.closest && e.target.closest("[data-ledger-wager-live]");
      if (wagerLive) {
        const form = wagerLive.form || wagerLive.closest("form");
        ledgerPaintWagerPreview(form);
        if (wagerLive.getAttribute("name") === "desc") ledgerPaintDescBox(form);
        return;
      }
      if (e.target && e.target.id === "gateUser") {
        gateUsernameDraft = String(e.target.value || "");
        return;
      }
      if (e.target && (e.target.id === "profileZoom" || e.target.dataset.profileZoom)) {
        if (!profileCrop) return;
        profileCrop.zoom = Math.max(1, Math.min(3, Number(e.target.value) || 1));
        paintProfileCrop();
        return;
      }
      const calcFilterBox = e.target.closest("[data-calc-filter]");
      if (calcFilterBox) {
        const side = calcFilterBox.getAttribute("data-calc-filter") || "a";
        if (side === "b") calcFilterB = calcFilterBox.value || "";
        else calcFilterA = calcFilterBox.value || "";
        calcSide = side;
        const start = calcFilterBox.selectionStart;
        const end = calcFilterBox.selectionEnd;
        render();
        const back = document.querySelector('#app [data-calc-filter="' + side + '"]');
        if (back) {
          back.focus({ preventScroll: true });
          try { back.setSelectionRange(start, end); } catch (err) { /* ignore */ }
        }
        return;
      }
      const cuffQBox = e.target.closest("[data-cuff-q]");
      if (cuffQBox) {
        cuffFilterQ = cuffQBox.value;
        cuffFilterPlayerId = ""; // typing replaces a news-pinned player filter
        if (cuffFilterQ.trim()) cuffFilterMine = false;
        const start = cuffQBox.selectionStart;
        const end = cuffQBox.selectionEnd;
        render();
        const back = document.querySelector("#app [data-cuff-q]");
        if (back) {
          back.focus({ preventScroll: true });
          try { back.setSelectionRange(start, end); } catch (err) { /* ignore */ }
        }
        return;
      }
      const tapePlayerBox = e.target.closest("[data-tape-player-q]");
      if (!tapePlayerBox) return;
      tapePlayerQ = tapePlayerBox.value;
      tapePlayer = "all";
      tapeLimit = 20;
      tapeFilterOpen = true;
      const start = tapePlayerBox.selectionStart;
      const end = tapePlayerBox.selectionEnd;
      render();
      const back = document.querySelector("#app [data-tape-player-q]");
      if (back) {
        back.focus({ preventScroll: true });
        try { back.setSelectionRange(start, end); } catch (err) { /* ignore */ }
      }
    });
    // App boot: account gate → league home → dashboard. The meter only loads after a league
    // is selected. Vote tallies still load after paint when we enter a ready league.
    ledgerForgetPersistedCompose();
    window.addEventListener("pagehide", function () {
      ledgerAbandonCompose();
    });
    authLoad();
    const inviteParam = (params.get("invite") || "").trim();
    if (inviteParam) {
      redeemCode = inviteParam.toUpperCase();
      gateMode = "signup";
      // Drop ?invite= from the address bar immediately. Leaving CF-XXXX in the URL while the
      // username/password fields paint is how iOS Keychain / password managers save the seat
      // ticket as the account password. redeemCode keeps the value for signup → redeem.
      try {
        const u = new URL(location.href);
        if (u.searchParams.has("invite")) {
          u.searchParams.delete("invite");
          const q = u.searchParams.toString();
          history.replaceState(history.state || {}, "", u.pathname + (q ? "?" + q : "") + u.hash);
        }
      } catch (err) { /* ignore */ }
      loadInvitePreview().catch((err) => console.error(err));
    }
    paintSettingsBtn();
    paintBrandHome();
    paintLeagueSub();
    paintBottomNav();
    document.getElementById("app").hidden = false;
    (async () => {
      try {
        if (!authSession) {
          appScreen = "gate";
          if (inviteParam) gateMode = "signup";
          focusNext = ".screen-h";
          render();
          return;
        }
        await authRefreshIfNeeded();
        if (!authSession) {
          appScreen = "gate";
          render();
          return;
        }
        if (inviteParam) {
          await loadMemberships().catch((err) => console.error(err));
          // Already signed in: never auto-redeem. Opening a manager invite while logged in
          // used to claim that seat onto this account and leave the prior seat stamped claimed.
          joinError = "";
          appScreen = "inviteConfirm";
          focusNext = ".screen-h";
          render();
          return;
        }
        // Design Mode entry (design-league-home.html): skip the memberships API — the
        // design-mode token cannot fetch remote rows, and without a local match boot used to
        // fall through to Your leagues (the old app home) instead of the PSA league home.
        // Re-seed sticky flag from ?design= (syncUrl strips it later). Never remove the flag
        // on boot — reloads must keep skipping soft-delete + memberships.
        try {
          if ((params.get("design") || "") === "league-home") {
            sessionStorage.setItem("cuckle.design.league_home", "1");
          }
        } catch (err) { /* private mode */ }
        const designLeagueHome = isDesignLeagueHome();
        if (!designLeagueHome) {
          await loadMemberships().catch((err) => console.error(err));
        }
        if (activeLeague && activeLeague.sleeper_league_id) {
          const m = (memberships || []).find((x) => x.sleeper_league_id === activeLeague.sleeper_league_id);
          if (m) {
            activeLeague = Object.assign({}, activeLeague, {
              name: m.name,
              status: m.status,
              sleeper_user_id: m.sleeper_user_id,
              team_name: m.team_name,
            });
            saveActiveLeague(activeLeague);
          }
          if (m || designLeagueHome) {
            try {
              await openLeagueDashboard(activeLeague);
              return;
            } catch (err) {
              console.error(err);
              appScreen = "dash";
              render();
              return;
            }
          }
        }
        appScreen = "home";
        focusNext = ".screen-h";
        render();
      } catch (err) {
        document.getElementById("lead").textContent = "Could not start the app. Hard-refresh and try again.";
        console.error(err);
        appScreen = "gate";
        render();
      }
    })();
    // Installable shell (browser + home-screen). Push stays parked.
    // On every visit/refresh: fetch a fresh sw.js (ignore HTTP cache), activate it, and
    // reload once so claimed seats pick up merges to main without ?v= cache-bust links.
    if ("serviceWorker" in navigator) {
      (function armServiceWorkerAutoUpdate() {
        var reloaded = false;
        // First install also fires controllerchange — only reload on a *replacement* SW.
        var hadController = !!navigator.serviceWorker.controller;
        function reloadOnce() {
          if (!hadController) { hadController = true; return; }
          if (reloaded) return;
          try {
            if (typeof ledgerComposeOpen === "function" && ledgerComposeOpen()) {
              return;
            }
            if (sessionStorage.getItem("cuckle.swReloaded") === "1") return;
            sessionStorage.setItem("cuckle.swReloaded", "1");
          } catch (_) {}
          reloaded = true;
          location.reload();
        }
        navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
        // Drop any Cache Storage buckets left by older SW versions that still held HTML.
        function purgeStaleCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.indexOf("chuckle-shell-") === 0 && k !== "chuckle-shell-v206-ledger-ptr";
            }).map(function (k) { return caches.delete(k); }));
          }).catch(function () {});
        }
        purgeStaleCaches();
        navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function (reg) {
          function check() {
            try { reg.update(); } catch (_) {}
          }
          check();
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") check();
          });
          window.addEventListener("focus", check);
          // Clear the one-shot reload guard after a quiet moment so the *next* deploy can reload again.
          setTimeout(function () {
            try { sessionStorage.removeItem("cuckle.swReloaded"); } catch (_) {}
          }, 4000);
        }).catch(function (err) { console.warn("sw", err); });
      })();
    }
  </script>
</body>
