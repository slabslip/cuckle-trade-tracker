    function ledgerFmtOdds(n) {
      const o = Math.round(Number(n) || 0);
      if (!o) return "0";
      return o > 0 ? ("+" + o) : String(o);
    }

    function ledgerComposeHold() {
      let hold = document.getElementById("ledgerComposeHold");
      if (!hold) {
        hold = document.createElement("div");
        hold.id = "ledgerComposeHold";
        hold.hidden = true;
        document.body.appendChild(hold);
      }
      return hold;
    }

    const LEDGER_COMPOSE_KEY = "cuckle.ledger.compose.v1";

    function ledgerComposeOpen() {
      return !!(ledgerWagerOpen || ledgerCounterId);
    }

    function ledgerOnComposePage() {
      return appScreen === "dash" && view === "home" && homeTab === "ledger";
    }

    function ledgerComposeStayPut() {
      if (!ledgerComposeOpen() || !ledgerOnComposePage()) return false;
      return !!document.querySelector("#app [data-ledger-wager-form], #app [data-ledger-counter-form]");
    }

    function ledgerForgetPersistedCompose() {
      try { sessionStorage.removeItem(LEDGER_COMPOSE_KEY); } catch (_) { /* private mode */ }
    }

    function ledgerAbandonCompose() {
      ledgerWagerOpen = false;
      ledgerCounterId = null;
      ledgerClearCompose();
    }

    function ledgerDropComposeIfLeft() {
      if (ledgerComposeOpen() && !ledgerOnComposePage()) ledgerAbandonCompose();
    }

    function ledgerMaybeRender() {
      ledgerDropComposeIfLeft();
      if (ledgerComposeOpen()) {
        const form = document.querySelector("#app [data-ledger-wager-form], #app [data-ledger-counter-form]");
        if (form) {
          ledgerCaptureCompose(form, { merge: true });
          ledgerHydrateCompose(form);
          const ae = document.activeElement;
          if (!ae || ae.getAttribute("name") !== "them") ledgerRefreshThemOptions(form);
        }
        return false;
      }
      render();
      return true;
    }

    function ledgerParkCompose() {
      if (!ledgerComposeOpen() || !ledgerOnComposePage()) return;
      const form = document.querySelector("#app [data-ledger-wager-form], #app [data-ledger-counter-form]");
      if (!form) return;
      const ae = document.activeElement;
      if (ae && form.contains(ae)) {
        ledgerComposeFocus = {
          name: ae.getAttribute("name") || "",
          start: ae.selectionStart,
          end: ae.selectionEnd,
        };
      } else {
        ledgerComposeFocus = null;
      }
      ledgerCaptureCompose(form, { merge: true });
      ledgerHydrateCompose(form);
      ledgerComposeNode = form;
      ledgerComposeHold().appendChild(form);
    }

    function ledgerUnparkCompose() {
      if (!ledgerComposeNode) return;
      const slot = document.querySelector("[data-ledger-form-slot]");
      if (slot) {
        slot.replaceWith(ledgerComposeNode);
        ledgerHydrateCompose(ledgerComposeNode);
        const ae = document.activeElement;
        if (!ae || ae.getAttribute("name") !== "them") ledgerRefreshThemOptions(ledgerComposeNode);
        ledgerRestoreComposeFocus();
        return;
      }
      if (!ledgerWagerOpen && !ledgerCounterId) {
        if (ledgerComposeNode.parentNode) ledgerComposeNode.parentNode.removeChild(ledgerComposeNode);
        ledgerComposeNode = null;
        const hold = document.getElementById("ledgerComposeHold");
        if (hold && hold.parentNode) hold.parentNode.removeChild(hold);
      }
    }

    function ledgerRememberCompose() {
      const form = document.querySelector("#app [data-ledger-wager-form], #app [data-ledger-counter-form]");
      if (form && (ledgerWagerOpen || ledgerCounterId)) {
        ledgerComposeNode = form;
        ledgerHydrateCompose(form);
        const ae = document.activeElement;
        if (!ae || ae.getAttribute("name") !== "them") ledgerRefreshThemOptions(form);
      }
    }

    function ledgerRefreshThemOptions(form) {
      if (!form) return;
      const sel = form.querySelector("[data-ledger-send-select]");
      if (sel) {
        const hid = form.querySelector("[name=them]");
        const cur = (hid && hid.value) || (ledgerComposeDraft && ledgerComposeDraft.them) || "";
        const others = ledgerOtherSeatsByTradeFreq();
        sel.innerHTML = ['<option value="">team</option>'].concat(others.map((m) => {
          const selected = String(m.user_id) === String(cur) ? " selected" : "";
          return '<option value="' + esc(m.user_id) + '"' + selected + ">" + esc(m.name || m.user_id) + "</option>";
        })).join("");
        if (cur) sel.value = cur;
        return;
      }
      const legacy = form.querySelector("select[name=them]");
      if (!legacy) return;
      const cur = legacy.value || (ledgerComposeDraft && ledgerComposeDraft.them) || "";
      const others = ledgerOtherSeatsByTradeFreq();
      legacy.innerHTML = ['<option value="">team</option>'].concat(others.map((m) => {
        const selected = String(m.user_id) === String(cur) ? " selected" : "";
        return '<option value="' + esc(m.user_id) + '"' + selected + ">" + esc(m.name || m.user_id) + "</option>";
      })).join("");
      if (cur) legacy.value = cur;
    }

    function ledgerCaptureCompose(form, opts) {
      if (!ledgerWagerOpen && !ledgerCounterId) return;
      if (!form) {
        form = document.querySelector("[data-ledger-wager-form], [data-ledger-counter-form]");
      }
      if (!form) return;
      const fd = new FormData(form);
      const counter = form.getAttribute("data-ledger-counter-form");
      const next = {
        kind: counter ? "counter" : "new",
        id: counter || "",
        them: String(fd.get("them") || ""),
        stake: String(fd.get("stake") || ""),
        odds: String(ledgerSnapOdds(fd.get("odds"))),
        desc: String(fd.get("desc") || ""),
        clock_kind: String(fd.get("clock_kind") || "this_week"),
        clock: String(fd.get("clock") || ""),
      };
      const merge = !opts || opts.merge !== false;
      const prev = ledgerComposeDraft;
      const ae = document.activeElement;
      const focused = (ae && form.contains(ae)) ? (ae.getAttribute("name") || "") : "";
      if (prev && prev.kind === next.kind && String(prev.id || "") === String(next.id || "")) {
        if (!next.them && prev.them && (merge || focused !== "them")) next.them = prev.them;
        if (!String(next.stake || "").trim() && prev.stake && (merge || focused !== "stake")) next.stake = prev.stake;
        if (!next.desc && prev.desc && (merge || focused !== "desc")) next.desc = prev.desc;
        if (!next.clock && prev.clock && (merge || focused !== "clock")) next.clock = prev.clock;
      }
      ledgerComposeDraft = next;
    }

    function ledgerHydrateCompose(form) {
      const d = ledgerComposeDraft;
      if (!form || !d) return;
      const them = form.querySelector("[name=them]");
      const stake = form.querySelector("[name=stake]");
      const desc = form.querySelector("[name=desc]");
      const clock = form.querySelector("[name=clock]");
      if (them && !them.value && d.them) them.value = d.them;
      if (stake && !String(stake.value || "").trim() && d.stake) stake.value = d.stake;
      if (form.querySelector("[data-ledger-stake-range]")) {
        ledgerApplyStakeSlider(form, (stake && stake.value) || d.stake || 100);
      }
      if (desc && !String(desc.value || "").trim() && d.desc) desc.value = d.desc;
      if (desc) ledgerPaintDescBox(form);
      if (clock && !clock.value && d.clock) clock.value = d.clock;
      const send = form.querySelector("[data-ledger-send-lab]");
      if (send && form.hasAttribute("data-ledger-wager-form")) {
        const who = (them && them.value) || d.them;
        send.textContent = ledgerSendLabel(who);
      }
    }

    function ledgerClearCompose() {
      ledgerComposeDraft = null;
      ledgerComposeFocus = null;
      try { sessionStorage.removeItem(LEDGER_COMPOSE_KEY); } catch (_) { /* ignore */ }
      if (ledgerComposeNode && ledgerComposeNode.parentNode) {
        ledgerComposeNode.parentNode.removeChild(ledgerComposeNode);
      }
      ledgerComposeNode = null;
      const hold = document.getElementById("ledgerComposeHold");
      if (hold && hold.parentNode) hold.parentNode.removeChild(hold);
    }

    function ledgerRestoreComposeFocus() {
      if (!ledgerComposeFocus || !ledgerComposeNode) return;
      const name = ledgerComposeFocus.name;
      let el = null;
      if (name) {
        const fields = ledgerComposeNode.querySelectorAll("[name]");
        for (let i = 0; i < fields.length; i++) {
          if (fields[i].getAttribute("name") === name) { el = fields[i]; break; }
        }
      }
      if (!el) return;
      el.focus({ preventScroll: true });
      try {
        if (ledgerComposeFocus.start != null && typeof el.setSelectionRange === "function") {
          el.setSelectionRange(ledgerComposeFocus.start, ledgerComposeFocus.end);
        }
      } catch (_) { /* range inputs */ }
    }

    function ledgerSendLabel(them) {
      return "Review";
    }

    function ledgerDraftFor(kind, b) {
      const d = ledgerComposeDraft;
      if (!d) return null;
      if (kind === "counter") {
        if (d.kind !== "counter" || !b || String(d.id) !== String(b.id)) return null;
      } else if (d.kind !== "new") return null;
      return d;
    }

    function ledgerSnapOdds(n) {
      let o = Math.round(Number(n) || 0);
      o = Math.round(o / 100) * 100;
      if (o < -500) o = -500;
      if (o > 500) o = 500;
      return o;
    }

    const LEDGER_STAKE_STOPS = [10, 20, 30, 40, 50, 100, 150, 200, 250, 300];
    const LEDGER_STAKE_DEFAULT = 100;

    function ledgerStakeStopIndex(dollars) {
      const n = Number(dollars);
      if (!Number.isFinite(n) || n <= 0) return 0;
      let best = 0;
      let bestD = Infinity;
      for (let i = 0; i < LEDGER_STAKE_STOPS.length; i++) {
        const d = Math.abs(LEDGER_STAKE_STOPS[i] - n);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      }
      return best;
    }

    function ledgerSnapStakeDollars(dollars) {
      return LEDGER_STAKE_STOPS[ledgerStakeStopIndex(dollars)];
    }

    function ledgerApplyStakeSlider(form, dollars) {
      const snapped = ledgerSnapStakeDollars(dollars);
      if (!form) return snapped;
      const hid = form.querySelector("[name=stake]");
      const range = form.querySelector("[data-ledger-stake-range]");
      const lab = form.querySelector("[data-ledger-stake-lab]");
      if (hid) hid.value = String(snapped);
      if (range) range.value = String(ledgerStakeStopIndex(snapped));
      if (lab) lab.textContent = "$" + snapped;
      return snapped;
    }

    function ledgerHouseOddsOf(b) {
      if (b && b.house_odds != null && b.house_odds !== "") {
        const n = Number(b.house_odds);
        if (Number.isFinite(n)) return n;
      }
      const raw = String((b && b.odds) || "").replace(/even/i, "0").replace(/^\+/, "");
      const n = Number(raw);
      return Number.isFinite(n) ? n : 0;
    }

    function ledgerOddsPreview(stakeCents, houseOdds) {
      const U = Math.max(0, Math.round(Number(stakeCents) || 0));
      const O = ledgerSnapOdds(houseOdds);
      let you_put_cents = U;
      let you_win_cents = U;
      let they_put_cents = U;
      let they_win_cents = U;
      if (U > 0 && O < 0) {
        you_put_cents = U;
        you_win_cents = Math.round(U * 100 / Math.abs(O));
        they_put_cents = you_win_cents;
        they_win_cents = U;
      } else if (U > 0 && O > 0) {
        // Plus is the line you offer them. $100 at +200: they risk 100, you risk 200.
        they_put_cents = U;
        they_win_cents = Math.round(U * O / 100);
        you_put_cents = they_win_cents;
        you_win_cents = U;
      }
      const nLab = U ? String(U / 100) : "N";
      let words = "Enter a stake to see what each side puts in and wins.";
      if (U && !O) {
        words = "Even. Both risk $" + nLab + ". Winner profits $" + nLab + ".";
      } else if (U && O < 0) {
        words = "You are favorite " + ledgerFmtOdds(O) + ". You risk $" + (you_put_cents / 100)
          + " to win $" + (you_win_cents / 100) + ". They risk $" + (they_put_cents / 100)
          + " to win $" + (they_win_cents / 100) + ".";
      } else if (U && O > 0) {
        words = "You offer " + ledgerFmtOdds(O) + ". They risk $" + (they_put_cents / 100)
          + " to win $" + (they_win_cents / 100) + ". You risk $" + (you_put_cents / 100)
          + " to win $" + (you_win_cents / 100) + ".";
      }
      return {
        you_put_cents: you_put_cents,
        you_win_cents: you_win_cents,
        they_put_cents: they_put_cents,
        they_win_cents: they_win_cents,
        house_odds: O,
        words: words,
      };
    }

    function ledgerClockPassed(b) {
      if (!b) return false;
      const kind = b.clock_kind || "date";
      const meta = (b.clock_meta && typeof b.clock_meta === "object") ? b.clock_meta : {};
      const st = ledgerNflState;
      const deadlinePast = !!(b.deadline_at && Number.isFinite(new Date(b.deadline_at).getTime())
        && new Date(b.deadline_at).getTime() < Date.now());
      if (kind === "playoffs" || kind === "season") {
        if (st) {
          const sameSeason = !meta.season || String(st.season) === String(meta.season);
          if (st.season_type === "regular" || st.season_type === "post") {
            if (sameSeason) return false;
          }
          if (st.season_type === "off" || st.season_type === "pre") return true;
          if (!sameSeason && Number(st.season) > Number(meta.season || 0)) return true;
        }
        return deadlinePast;
      }
      if (kind === "regular") {
        if (st) {
          if (st.season_type === "regular") {
            if (!meta.season || String(st.season) === String(meta.season)) return false;
          }
          return st.season_type !== "regular" || Number(st.season) > Number(meta.season || 0);
        }
        return deadlinePast;
      }
      if (kind === "this_week" || kind === "next_week") {
        if (st) {
          const sentWeek = Number(meta.week) || 0;
          const dueAfter = kind === "next_week" ? sentWeek + 1 : sentWeek;
          if (String(st.season) === String(meta.season || st.season) && st.season_type === "regular") {
            if (Number(st.week) <= dueAfter) return false;
            return Number(st.week) > dueAfter;
          }
          if (st.season_type !== "regular" && (meta.season_type || "regular") === "regular") return true;
          if (Number(st.season) > Number(meta.season || 0)) return true;
        }
        return deadlinePast;
      }
      return deadlinePast;
    }

    function ledgerIsDisputed(b) {
      return !!(b && b.status === "open" && b.side_a_claim && b.side_b_claim
        && b.side_a_claim !== b.side_b_claim);
    }

    function ledgerNamedTerms(b) {
      const money = ledgerReadTerms(b);
      if (!money.you_put_cents) return "";
      const house = ledgerSeatLabel(b.side_a || b.proposer);
      const them = ledgerSeatLabel(b.side_b);
      return house + " puts in $" + (money.you_put_cents / 100)
        + ". If they win they get $" + (money.you_win_cents / 100)
        + ". " + them + " puts in $" + (money.they_put_cents / 100)
        + ". If they win they get $" + (money.they_win_cents / 100) + ".";
    }

    function ledgerReadTerms(b) {
      const j = (b && b.terms_json && typeof b.terms_json === "object") ? b.terms_json : {};
      return {
        you_put_cents: Number(j.you_put_cents) || 0,
        you_win_cents: Number(j.you_win_cents) || 0,
        they_put_cents: Number(j.they_put_cents) || 0,
        they_win_cents: Number(j.they_win_cents) || 0,
      };
    }

    function ledgerPlainTerms(money) {
      return "You put in $" + (money.you_put_cents / 100)
        + ". If you win you get $" + (money.you_win_cents / 100)
        + ". They put in $" + (money.they_put_cents / 100)
        + ". If they win they get $" + (money.they_win_cents / 100) + ".";
    }

    function ledgerStatusChip(b) {
      const seat = authSeatId();
      if (b.status === "needs_review") return { cls: "needs", lab: "Finish this slip" };
      if (b.status === "proposed" && ledgerNeedsDetails(b)) {
        return { cls: "needs", lab: "Needs details" };
      }
      if (b.status === "proposed" && seat) {
        const needsMe = (String(b.side_a) === String(seat) && !b.side_a_lock)
          || (String(b.side_b) === String(seat) && !b.side_b_lock);
        if (needsMe) return { cls: "needs", lab: "Sent to you, you have not accepted this version" };
        return { cls: "needs", lab: "Pending, awaiting a response" };
      }
      if (ledgerIsDisputed(b)) return { cls: "disputed", lab: "Disputed — league vote" };
      if (b.status === "open" && ledgerClockPassed(b)) {
        const isA = seat && String(b.side_a) === String(seat);
        const isB = seat && String(b.side_b) === String(seat);
        const myClaim = isA ? b.side_a_claim : (isB ? b.side_b_claim : null);
        if ((isA || isB) && !myClaim) return { cls: "needs", lab: "Clock ended — pick a winner" };
        return { cls: "needs", lab: "Waiting on a winner pick" };
      }
      if (b.status === "open") return { cls: "open", lab: "Open" };
      if (b.status === "settled") return { cls: "settled", lab: "Settled" };
      if (b.status === "declined") return { cls: "bad", lab: "Declined" };
      if (b.status === "canceled") return { cls: "bad", lab: "Canceled" };
      if (b.status === "expired") return { cls: "bad", lab: "Expired" };
      return { cls: "", lab: b.status || "—" };
    }

    function ledgerCardActions(b, opts) {
      const readOnly = !!(opts && opts.readOnly);
      const seat = authSeatId();
      const isA = seat && String(b.side_a) === String(seat);
      const isB = seat && String(b.side_b) === String(seat);
      const isParty = !!(isA || isB);
      const isProposer = seat && String(b.proposer) === String(seat);
      let btns = "";
      if (seat && !readOnly && ledgerBusyId !== b.id && (isParty || isProposer)) {
        if (b.status === "needs_review" && isProposer) {
          btns += '<button type="button" class="chip" data-ledger-cancel="' + esc(b.id) + '">Trash</button>';
        }
        if (b.status === "proposed") {
          if (String(ledgerCompleteId) !== String(b.id) && ledgerNeedsDetails(b)) {
            btns += '<button type="button" class="chip" data-ledger-complete="' + esc(b.id) + '">Complete</button>';
          }
          const locked = isA ? b.side_a_lock : b.side_b_lock;
          if (isParty && !locked && String(ledgerCounterId) !== String(b.id)) {
            if (Number(b.amount_cents)) {
              btns += '<button type="button" class="chip" data-ledger-accept="' + esc(b.id) + '">Accept</button>'
                + '<button type="button" class="chip" data-ledger-counter="' + esc(b.id) + '">Counter</button>';
            } else {
              btns += '<button type="button" class="chip" data-ledger-accept="' + esc(b.id) + '">Accept</button>';
            }
          }
        }
        if (b.status === "open" && ledgerClockPassed(b) && isParty && !ledgerIsDisputed(b)) {
          const myClaim = isA ? b.side_a_claim : b.side_b_claim;
          if (!myClaim) {
            const meSide = isA ? "side_a" : "side_b";
            const themSide = isA ? "side_b" : "side_a";
            btns += '<button type="button" class="chip" data-ledger-claim="' + esc(b.id) + '" data-winner="' + meSide + '">I won</button>'
              + '<button type="button" class="chip" data-ledger-claim="' + esc(b.id) + '" data-winner="' + themSide + '">They won</button>'
              + '<button type="button" class="chip" data-ledger-claim="' + esc(b.id) + '" data-winner="push">Push</button>';
          }
        }
      }
      const canToggle = isParty && !readOnly && ledgerBusyId !== b.id && b.status !== "needs_review";
      const vis = b.status === "needs_review" ? "" : ledgerVisibilityToggle(b, { readOnly: !canToggle });
      if (!btns && !vis) return "";
      return (btns ? '<div class="lc-actions">' + btns + "</div>" : "") + vis;
    }

    function ledgerCanDeletePending(b, opts) {
      if (!b || (opts && opts.readOnly)) return false;
      if (b.status !== "proposed" || ledgerNeedsDetails(b)) return false;
      if (ledgerBusyId === b.id || String(ledgerCounterId) === String(b.id)) return false;
      const seat = authSeatId();
      if (!seat) return false;
      const isParty = String(b.side_a) === String(seat) || String(b.side_b) === String(seat);
      const isProposer = String(b.proposer) === String(seat);
      return !!(isParty || isProposer);
    }

    function ledgerPendingTrashHtml(b, opts) {
      if (!ledgerCanDeletePending(b, opts)) return "";
      return '<button type="button" class="lc-trash" data-ledger-cancel="' + esc(b.id)
        + '" aria-label="Delete pending wager">'
        + '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">'
        + '<path fill="currentColor" d="M9 3h6l1 2h5v2H3V5h5l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM6 7h12v12c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2V7z"/>'
        + "</svg></button>";
    }

    function ledgerVisibilityToggle(b, opts) {
      const readOnly = !!(opts && opts.readOnly);
      const pub = ledgerIsPublic(b);
      if (readOnly) {
        return '<div class="lc-vis" aria-label="Visibility">'
          + '<span class="caption">' + (pub ? "Public" : "Private") + "</span></div>";
      }
      return '<div class="lc-vis" role="group" aria-label="Visibility">'
        + '<button type="button" class="chip' + (pub ? " on" : "") + '" data-ledger-visibility="'
        + esc(b.id) + '" data-vis="public">Public</button>'
        + '<button type="button" class="chip' + (!pub ? " on" : "") + '" data-ledger-visibility="'
        + esc(b.id) + '" data-vis="private">Private</button>'
        + "</div>";
    }

    function ledgerCardHtml(b, opts) {
      const chip = ledgerStatusChip(b);
      const line = b.house_odds != null && b.house_odds !== ""
        ? (" · house " + esc(ledgerFmtOdds(b.house_odds)))
        : (b.odds ? (" · " + esc(b.odds)) : "");
      const footBits = [];
      const left = ledgerDaysLeft(b.deadline_at);
      if (left) footBits.push(left);
      if (b.deadline_at) {
        try {
          footBits.push("ends " + new Date(b.deadline_at).toLocaleDateString(undefined, {
            month: "short", day: "numeric", year: "numeric"
          }));
        } catch (_) {}
      }
      if (b.offer_rev && Number(b.offer_rev) > 1) footBits.push("offer v" + Number(b.offer_rev));
      if (b.clock_kind && b.clock_kind !== "date") footBits.push(ledgerClockKindLabel(b.clock_kind));
      if (b.winner) {
        const wLab = b.winner === "push" ? "Push"
          : (b.winner === "side_a" ? ledgerSeatLabel(b.side_a) : ledgerSeatLabel(b.side_b));
        footBits.push("winner " + wLab);
      }
      const draft = b.status === "needs_review";
      const houseLab = ledgerSeatLabel(b.side_a || b.proposer);
      const meta = draft
        ? "Leftover draft — pick a team, then Send"

    function ledgerStyleSuggest() {
      const seat = authSeatId();
      const rows = (ledgerBets || []).filter((b) => {
        if (!b || !seat) return false;
        if (b.status !== "open" && b.status !== "settled") return false;
        if (String(b.visibility || "public") === "private"
          && String(b.side_a) !== String(seat) && String(b.side_b) !== String(seat)) return false;
        return String(b.side_a) === String(seat) || String(b.side_b) === String(seat)
          || String(b.proposer) === String(seat);
      });
      const themCount = Object.create(null);
      const stakes = [];
      const odds = [];
      const clocks = Object.create(null);
      const lines = [];
      for (const row of rows) {
        const themId = String(row.side_a) === String(seat) ? row.side_b : row.side_a;
        if (themId) themCount[themId] = (themCount[themId] || 0) + 1;
        if (Number(row.amount_cents)) stakes.push(Number(row.amount_cents));
        const o = ledgerHouseOddsOf(row);
        if (Number.isFinite(o)) odds.push(o);
        if (row.clock_kind) clocks[row.clock_kind] = (clocks[row.clock_kind] || 0) + 1;
        if (String(row.proposer) === String(seat) && row.title) lines.push(String(row.title));
      }
      const mid = (arr) => {
        const a = arr.slice().sort((x, y) => x - y);
        if (!a.length) return null;
        const i = Math.floor(a.length / 2);
        return a.length % 2 ? a[i] : Math.round((a[i - 1] + a[i]) / 2);
      };
      let them = "";
      let themN = 0;
      Object.keys(themCount).forEach((id) => {
        if (themCount[id] > themN) { them = id; themN = themCount[id]; }
      });
      let clock = "";
      let clockN = 0;
      Object.keys(clocks).forEach((k) => {
        if (clocks[k] > clockN) { clock = k; clockN = clocks[k]; }
      });
      const uniq = [];
      for (let i = lines.length - 1; i >= 0 && uniq.length < 3; i--) {
        if (uniq.indexOf(lines[i]) < 0) uniq.push(lines[i]);
      }
      return { them: them, stake: mid(stakes), odds: mid(odds), clock: clock, lines: uniq };
    }

    async function ledgerEnsureWeekPts(week, season) {
      const w = Number(week) || 0;
      const yr = String(season || (ledgerNflState && ledgerNflState.season) || "");
      if (!w) return null;
      if (ledgerWeekPts && ledgerWeekPts.week === w && String(ledgerWeekPts.season || "") === yr) {
        return ledgerWeekPts;
      }
      const lid = (activeLeague && activeLeague.sleeper_league_id) || CUCKLE_LEAGUE_ID;
      const byId = Object.create(null);
      try {
        const rows = await fetch("https://api.sleeper.app/v1/league/" + encodeURIComponent(lid)
          + "/matchups/" + w).then((r) => r.json());
        for (const m of rows || []) {
          const pts = m && m.players_points;
          if (!pts || typeof pts !== "object") continue;
          Object.keys(pts).forEach((id) => {
            const n = Number(pts[id]);
            if (Number.isFinite(n)) byId[String(id)] = n;
          });
        }
      } catch (_) {}
      ledgerWeekPts = { week: w, season: yr, byId: byId };
      return ledgerWeekPts;
    }

    async function ledgerPersistHints(list) {

      const due = (list || []).filter((b) => {

        if (!ledgerClockPassed(b)) return false;
        const kind = b.clock_kind || "";

      });
      if (!due.length) return;
      try { await ensureKtcBook(); } catch (_) {}
      const weeks = Object.create(null);

        const w = ledgerHintWeek(b);
        const yr = (b.clock_meta && b.clock_meta.season) || (ledgerNflState && ledgerNflState.season) || "";
        if (w) weeks[yr + ":" + w] = { week: w, season: yr };
      });
      for (const key of Object.keys(weeks)) {
        await ledgerEnsureWeekPts(weeks[key].week, weeks[key].season);
      }
      for (const b of due) {
        if (b.suggest_note && b.suggest_pick) continue;
        const text = String(b.title || "") + " " + String(b.terms || "");
        const hit = ledgerMatchPlayer(text);

      if (!hay.trim()) return null;
      const cand = [];
      const add = (name, id) => {
        if (!name) return;
        const n = String(name);
        if (hay.indexOf(n.toLowerCase()) < 0) return;
        cand.push({
          name: n,
          id: id ? String(id) : "",
          n: n.length,
          points: ledgerPlayerWeekPts(id),
        });
      };
      const newsBook = (typeof news !== "undefined" && news && news.items) ? news.items : [];
      for (let i = 0; i < newsBook.length; i++) {
        const it = newsBook[i];
        const plist = (it && it.players) || [];
        for (let j = 0; j < plist.length; j++) {
          const p = plist[j];
          if (p) add(p.player, p.player_id);
        }
        if (it) add(it.player, it.player_id);
      }
      if (ktcBySleeper) {
        Object.keys(ktcBySleeper).forEach((id) => {
          const p = ktcBySleeper[id];
          if (p && p.name) add(p.name, p.sleeper_id || id);

      }
      add("Derrick Henry", "4983");
      add("Christian McCaffrey", "4034");
      add("Nico Collins", "7569");

    async function ledgerPatch(id, patch, eventKind, eventPayload) {
      const seat = authSeatId();
      if (!seat) {
        ledgerToast = "Claim a seat to manage slips.";
        render();
        return;
      }
      ledgerBusyId = id;
      ledgerToast = null;
      render();
      try {
        if (isDesignLeagueHome() || (authSession && authSession.access_token === "design-mode")) {
          ledgerBets = (ledgerBets || []).map((b) => {
            if (String(b.id) !== String(id)) return b;
            const next = Object.assign({}, b, patch);
            if (next.status === "proposed" && next.side_a_lock && next.side_b_lock) next.status = "open";
            return next;
          });
          ledgerToast = eventKind === "accepted" ? "Accepted."
            : eventKind === "declined" ? "Trashed."
            : eventKind === "canceled" ? "Trashed."
            : eventKind === "settled" ? "Settled. The W/L tab updated."
            : eventKind === "sent" ? "Sent. Waiting on them."
            : eventKind === "countered" ? "Sent back. Waiting on them."
            : eventKind === "claimed" ? "Pick saved."
            : eventKind === "voted" ? "Vote in."
            : eventKind === "edited"
              ? ((eventPayload && eventPayload.complete) || (patch && patch.title != null)
                ? "Slip updated."
                : "Visibility updated.")
            : "Updated.";
          return;
        }
        const res = await fetch(VOTE_API + "/ledger_bets?id=eq." + encodeURIComponent(id), {
          method: "PATCH",
          headers: Object.assign({}, ledgerAuthHeaders(), { Prefer: "return=representation" }),
          body: JSON.stringify(patch),
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(t || ("patch " + res.status));
        }
        const rows = await res.json();
        const updated = Array.isArray(rows) ? rows[0] : null;
        if (updated) {
          ledgerBets = (ledgerBets || []).map((b) => String(b.id) === String(id) ? updated : b);
        }
        if (eventKind) {
          await fetch(VOTE_API + "/ledger_bet_events", {
            method: "POST",
            headers: ledgerAuthHeaders(),
            body: JSON.stringify({
              bet_id: id,
              actor: seat,
              kind: eventKind,
              payload: eventPayload || {},
            }),
          }).catch(() => null);
        }
        ledgerToast = eventKind === "accepted" ? "Accepted."
          : eventKind === "declined" ? "Trashed."
          : eventKind === "canceled" ? "Trashed."
          : eventKind === "settled" ? "Settled. The W/L tab updated."
          : eventKind === "sent" ? "Sent. Waiting on them."
          : eventKind === "countered" ? "Sent back. Waiting on them."
          : eventKind === "claimed" ? "Pick saved."
          : eventKind === "voted" ? "Vote in."
          : eventKind === "edited"
            ? ((eventPayload && eventPayload.complete) || (patch && patch.title != null)
              ? "Slip updated."
              : "Visibility updated.")
          : "Updated.";
        await ledgerFetch();
      } catch (err) {
        console.error(err);
        ledgerToast = "Could not update that slip. Try again.";
      } finally {
        ledgerBusyId = null;
        if (homeTab === "ledger" || (me && data)) render();
      }
    }

    function ledgerAccept(id) {
      const seat = authSeatId();
      const b = (ledgerBets || []).find((x) => String(x.id) === String(id));
      if (!b || !seat) return;
      if (!Number(b.amount_cents)) {
        ledgerToast = "Ask them to finish the dollar amounts first.";
        ledgerCompleteId = id;
        render();
        return;
      }
      const patch = {};
      if (String(b.side_a) === String(seat)) patch.side_a_lock = true;
      else if (String(b.side_b) === String(seat)) patch.side_b_lock = true;
      else return;
      ledgerPatch(id, patch, "accepted", {});
    }

    function ledgerDecline(id) {
      ledgerPatch(id, { status: "declined" }, "declined", {});
    }

    function ledgerCancel(id) {
      ledgerPatch(id, { status: "canceled" }, "canceled", {});
    }

    function ledgerClaim(id, winner) {
      if (!winner || ["side_a", "side_b", "push"].indexOf(winner) < 0) return;
      const seat = authSeatId();
      const b = (ledgerBets || []).find((x) => String(x.id) === String(id));
      if (!b || !seat || b.status !== "open") return;
      if (!ledgerClockPassed(b)) {
        ledgerToast = "Wait until the clock ends.";
        render();
        return;
      }
      const isA = String(b.side_a) === String(seat);
      const isB = String(b.side_b) === String(seat);
      if (!isA && !isB) return;
      const patch = isA ? { side_a_claim: winner } : { side_b_claim: winner };
      const other = isA ? b.side_b_claim : b.side_a_claim;
      if (other && other === winner) {
        patch.status = "settled";
        patch.winner = winner;
        ledgerPatch(id, patch, "settled", { winner: winner, claim: winner });
        return;
      }
      ledgerPatch(id, patch, "claimed", { claim: winner });
    }

    function ledgerApplyVoteMajority(id) {
      const votes = (ledgerVotes || []).filter((v) => String(v.bet_id) === String(id));
      let nA = 0, nB = 0, nP = 0;
      for (const v of votes) {
        if (v.pick === "side_a") nA += 1;
        else if (v.pick === "side_b") nB += 1;
        else if (v.pick === "push") nP += 1;
      }
      let winner = null;
      if (nA > nB && nA > nP) winner = "side_a";
      else if (nB > nA && nB > nP) winner = "side_b";
      else if (nP > nA && nP > nB) winner = "push";
      if (!winner) return;
      ledgerBets = (ledgerBets || []).map((b) => {
        if (String(b.id) !== String(id) || b.status !== "open") return b;
        return Object.assign({}, b, { status: "settled", winner: winner });
      });
    }

    async function ledgerVote(id, pick) {
      if (!pick || ["side_a", "side_b", "push"].indexOf(pick) < 0) return;
      const seat = authSeatId();
      const b = (ledgerBets || []).find((x) => String(x.id) === String(id));
      if (!b || !seat || !ledgerIsDisputed(b)) return;
      ledgerBusyId = id;
      ledgerToast = null;
      render();
      try {
        if (isDesignLeagueHome() || (authSession && authSession.access_token === "design-mode")) {
          ledgerVotes = (ledgerVotes || []).filter((v) =>
            !(String(v.bet_id) === String(id) && String(v.voter) === String(seat)));
          ledgerVotes.push({
            id: "design-vote-" + Date.now(),
            bet_id: id,
            voter: seat,
            pick: pick,
          });
          ledgerApplyVoteMajority(id);
          ledgerToast = "Vote in.";
          return;
        }
        const existing = (ledgerVotes || []).find((v) =>
          String(v.bet_id) === String(id) && String(v.voter) === String(seat));
        if (existing && existing.id) {
          const res = await fetch(VOTE_API + "/ledger_settle_votes?id=eq." + encodeURIComponent(existing.id), {
            method: "PATCH",
            headers: Object.assign({}, ledgerAuthHeaders(), { Prefer: "return=representation" }),
            body: JSON.stringify({ pick: pick }),
          });
          if (!res.ok) throw new Error("vote " + res.status);
        } else {
          const res = await fetch(VOTE_API + "/ledger_settle_votes", {
            method: "POST",
            headers: Object.assign({}, ledgerAuthHeaders(), { Prefer: "return=representation" }),
            body: JSON.stringify({ bet_id: id, voter: seat, pick: pick }),
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t || ("vote " + res.status));
          }
        }

      const form = typeof sel === "string" ? document.querySelector(sel) : sel;

      const desc = String(fd.get("desc") || "").trim();

      const odds = ledgerSnapOdds(fd.get("odds"));
      const clockRaw = String(fd.get("clock") || "").trim();
      let kind = String(fd.get("clock_kind") || "this_week").trim();
      if (["this_week","next_week","regular","season","playoffs","date"].indexOf(kind) < 0) kind = "this_week";
      let deadline_at = null;
      if (kind === "date" && clockRaw) {
        const t = new Date(clockRaw + "T23:59:59");
        if (Number.isFinite(t.getTime())) deadline_at = t.toISOString();
      } else if (kind !== "date") {
        deadline_at = ledgerEstimateDeadline(kind, ledgerNflState);
      }
      const money = ledgerOddsPreview(stake, odds);
      const title = desc.split(/\r?\n/)[0].trim().slice(0, 160);
      return {
        them: them,
        desc: desc,
        title: title,
        stake: stake,
        odds: odds,
        deadline_at: deadline_at,
        clock_kind: kind,
        clock_meta: ledgerClockMetaNow(),
        money: money,
      };

      if (!parsed || !seat) return "Claim a seat first.";

        if (parsed.them === String(seat)) return "Pick a different team.";
      }
      if (!parsed.desc || !parsed.title) return "Write what the bet is.";
      if (!parsed.stake) return "Enter your wager.";
      if (!parsed.clock_kind) return "Pick a clock.";
      if (parsed.clock_kind === "date") {
        if (!parsed.deadline_at) return "Set the clock.";
        if (new Date(parsed.deadline_at).getTime() <= Date.now()) return "Clock has to be in the future.";
      } else if (!parsed.deadline_at) {
        return "Could not resolve that NFL clock. Try again.";
      }
      return "";

    /** "3h ago". Null means the source's own date was unparseable, so say nothing rather than lie. */
    function ago(ms) {
      if (!ms) return "";
      const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
      if (s < 90) return "just now";
      const m = Math.round(s / 60);
      if (m < 60) return m + "m ago";
      const h = Math.round(m / 60);
      if (h < 36) return h + "h ago";
      return Math.round(h / 24) + "d ago";
    }

    const NEWS_CATS = {
      injury: "Injury", suspension: "Suspension", off_field: "Off the field",
      trade: "Trade", depth_chart: "Depth chart", breakout: "Breakout", news: "News",
      tweet: "X",
    };

    /**
     * News and Alerts, below the league data sets.
     *
     * Every string in a row comes from the open internet -- a headline, a summary and a source
     * label written by somebody else's CMS -- which makes this the most exposed surface in the
     * app. Every one of them goes through esc(), in text and in attributes alike, and the href
     * is additionally gated to http/https so a "javascript:" URL in a feed cannot become a link.
     * The only field this repo authors is league_line, and that is escaped too rather than
     * trusted for being ours.
     */
    function renderNewsBody() {
      const book = news && news.v === 1 ? news : null;
      const raw = (book && book.items) || [];
      // Soft-deleted posts stay in news.json until the next sync rebuild; newsGone is what
      // makes Remove take effect on this device immediately, and for every visitor once the
      // deleted_at stamp has been read from Supabase.
      const items = raw.filter((it) => !newsGone.has(it.id));
      // Heading only. The rows carry their own sharer, category and timestamp, so a paragraph
      // describing the feed was restating what the first row already shows. The empty state
      // still explains how an item gets here, which is the one thing a row cannot.
      const head = '<h2>News and Alerts</h2>';
      if (!items.length) {
        /**
         * Two different nothings, and they must not read the same.
         *
         * A null book is the load having failed -- the file missing, unreadable, or a version
         * this page does not know -- and the loader deliberately swallows all three so the feed
         * cannot take the page down. Printing "nothing has been shared yet" over that is the
         * page stating something it does not know, and stating it reassuringly: the user would
         * go looking at their Shortcut for a fault that is on this end.
         *
         * A book that loaded and holds no items is the real empty state, and it is the normal
         * one right now -- the feed is manual submissions only, so it is genuinely bare until
         * somebody shares. It has to read as a feed waiting for its first item rather than as a
         * feature that broke, and it has to say how an item gets here, because sharing from X
         * is the entire mechanism and it is not discoverable from this page.
         *
         * (No backticks in this comment: the whole page is one template literal.)
         */
        // The empty sentence is short on purpose, and it is now the only prose in this section:
        // the descriptive caption that used to sit above the box is gone, so this sentence is
        // the one place the mechanism is written down. It stays one line because a reader
        // staring at an empty box needs the action that fills it, not a description of the
        // feed they can already see is bare.
        // A third case: the book has rows but every one is soft-deleted. That is not "nothing
        // shared yet" and not a load failure — it is an emptied feed.
        const blank = !book
          ? "The feed could not be loaded. Nothing else on this page is affected."
          : (raw.length
            ? "No posts in the feed right now."
            : "Nothing shared yet.");
        return head + '<div class="news-box"><p class="news-empty">' + esc(blank) + "</p></div>";
      }
      // Remove is admin-only in the UI. League home clears me, so this reads the remembered
      // seat — claimed seat (Phase 1) preferred, else remembered Teams seat.
      const admin = isNewsAdmin();
      const rows = items.map((it) => {
        const url = String(it.source_url || "");
        // Only http(s) becomes a link. Anything else -- and a feed is fully capable of shipping
        // "javascript:" -- renders as a plain row instead.
        const safe = /^https?:\/\//i.test(url) ? url : "";
        const when = ago(it.published);
        const cat = NEWS_CATS[it.category] || "News";
        const also = (it.also || []).length ? " +" + (it.also || []).length + " more" : "";
        const playerBits = (Array.isArray(it.players) && it.players.length)
          ? it.players.filter((p) => p && p.player).map((p) => {
            return esc(p.player)
              + (p.player_team ? " \u00b7 " + esc(p.player_team) : "")
              + (p.player_position ? " " + esc(p.player_position) : "");
          })
          : (it.player
            ? [esc(it.player)
              + (it.player_team ? " \u00b7 " + esc(it.player_team) : "")
              + (it.player_position ? " " + esc(it.player_position) : "")]
            : []);
        const where = [
          playerBits.join(" · "),
          esc(it.source_label || it.source) + esc(also),
          when ? esc(when) : "",
        ].filter(Boolean).join(" \u00b7 ");
        // An unaddressed shared tweet matched nobody, so there is no name to print. The label
        // says so rather than leaving an empty slot that reads as a rendering fault. Multi-tag
        // rows list every matched seat in the header (managers[]); single-tag rows use manager.
        const whoNames = (Array.isArray(it.managers) && it.managers.length)
          ? it.managers.filter(Boolean)
          : (it.manager ? [it.manager] : []);
        const who = whoNames.length
          ? whoNames.map((n) => seatLabel(n)).join(" \u00b7 ")
          : (it.category === "tweet" ? "The league" : "");
        // Sharer's note, attributed, then the locker-room / factual summary. Both may be absent
        // on older rows; either alone is enough for the top of the post.
        const noteBit = it.note
          ? '<div class="news-note"><span class="news-note-by">'
            + (it.submitted_by ? seatLabel(it.submitted_by) : esc("Someone")) + ":</span> " + esc(it.note) + "</div>"
          : "";
        const inner = '<div class="news-top"><span class="news-who">' + who + "</span>"
          + '<span class="news-cat">' + esc(cat) + "</span></div>"
          + noteBit
          + '<div class="news-line">' + newsPullupLineHtml(it.league_line, it) + "</div>"
          + (it.headline ? '<div class="news-head">\u201c' + esc(it.headline) + "\u201d</div>" : "")
          + '<div class="news-meta">' + where + "</div>";

        /**
         * A tweet somebody shared in: manager tag, compact locker-room summary, then citation.
         *
         * **The row is a <div> and never an <a>.** See tweet (and Remove) are real controls;
         * nesting them inside a row-level link is defect A1.
         *
         * The full tweet text stays off the row on purpose -- it ate the viewport. The summary
         * is the copy; @handle + relative time + See tweet is the receipt. tweet_text still
         * has to exist on the item (the branch gate) so a row without oEmbed text cannot ship
         * an empty roast with a dead link.
         *
         * (No backticks in this comment: the whole page is one template literal.)
         */
        if (it.category === "tweet" && it.tweet_text) {
          /**
           * The link out is labelled "See tweet", so it may only go to X.
           *
           * The escapes are doubled because this whole page is one template literal: a lone
           * backslash is swallowed. A build guard asserts this exact x.com shape survived.
           */
          const xLink = /^https:\/\/x\.com\/[A-Za-z0-9_]{1,15}\/status\/[0-9]{1,25}$/.test(url) ? url : "";
          const handle = it.tweet_handle ? "@" + esc(it.tweet_handle) : "";
          const subId = newsSubmissionId(it.id);
          const del = (admin && subId)
            ? '<button type="button" class="news-del" data-news-del="' + esc(it.id) + '"'
              + (newsDelPending === it.id ? " disabled" : "")
              + ' aria-label="Remove this post from the feed">'
              + (newsDelPending === it.id ? "Removing\u2026" : "Remove")
              + "</button>"
            : "";
          const footBits = [];
          if (handle) footBits.push('<span class="news-tweet-handle">' + handle + "</span>");
          if (when) footBits.push('<span class="news-tweet-when">' + esc(when) + "</span>");
          if (xLink) {
            footBits.push(
              '<a class="news-tweet-link" href="' + esc(xLink)
                + '" target="_blank" rel="noopener noreferrer">See tweet</a>'
            );
          }
          const foot = footBits.length
            ? '<div class="news-tweet-foot">'
              + footBits.join('<span class="news-tweet-sep" aria-hidden="true">\u00b7</span>')
              + del
              + "</div>"
            : (del ? '<div class="news-tweet-foot">' + del + "</div>" : "");
          return '<div class="news-row news-row-tweet">'
            + '<div class="news-top"><span class="news-who">' + who + "</span>"
            + '<span class="news-cat">' + esc(cat) + "</span></div>"
            + noteBit
            + '<div class="news-line news-line-tweet">' + newsPullupLineHtml(it.league_line, it) + "</div>"
            + foot
            + "</div>";
        }
        return safe
          ? '<a class="news-row" href="' + esc(safe) + '" target="_blank" rel="noopener noreferrer">' + inner + "</a>"
          : '<div class="news-row">' + inner + "</div>";
      }).join("");
      return head
        + '<div class="news-box" tabindex="0" role="region" aria-label="News and alerts, ' + items.length + ' items">'
        + rows + "</div>";
    }

    /**
     * Two controls, deliberately separate, and now in two different places. The clock -- At
     * trade, first 1/2/3 years, since trade -- is persistent chrome in the brand header, because
     * it is a global setting that six screens read. dataSetRow() picks which list is on this one
     * screen and is one cell of the chip box below. Folding them together would put two
     * unrelated axes in one menu and would take the clock away from Most lopsided, which is the
     * set that reads it.
     */
    function renderLeagueHome() {
      // News Feed peeks at the bottom as a pull-up sheet; the dedicated news screen remains
      // view=news. Each block is isolated so a throw in Latest trade cannot blank the feed
      // (and the reverse) — concurrent Design Mode edits previously could take down the whole home.
      // Top tabs (Home | Teams | Ledger | History) swap body in place.
      let hero = "";
      let chips = "";
      let progress = "";
      let tabBody = "";
      try { chips = homeChips(); } catch (err) { console.error(err); chips = ""; }
      if (!chips) {
        try { chips = homeChips(); } catch (err2) { console.error(err2); }
      }
      if (homeTab === "teams") {
        try { tabBody = renderTeamsPage(); } catch (err) { console.error(err); tabBody = ""; }
      } else if (homeTab === "ledger") {
        try { tabBody = renderLedger(); } catch (err) { console.error(err); tabBody = ""; }
      } else if (homeTab === "history") {
        try { tabBody = renderDataSetsPage(); } catch (err) { console.error(err); tabBody = ""; }
      } else {
        // home (default) — digest
        try { progress = leagueInProgress(); } catch (err) { console.error(err); progress = ""; }
      }
      try { hero = dayAlert(); } catch (err) { console.error(err); hero = ""; }
      // Never paint a home with a missing News Feed shell — dayAlert should always return one,
      // but a thrown path above used to leave a blank first viewport in Design Mode.
      if (!hero) {
        hero = '<aside class="news-pullup" id="newsPullup" aria-label="News Feed"'
          + ' data-news-pullup="1" aria-expanded="false">'
          + '<div class="news-pullup-scrim" data-news-pullup-scrim hidden></div>'
          + '<div class="news-pullup-sheet" data-news-pullup-sheet role="dialog"'
          + ' aria-modal="false" aria-labelledby="newsPullupTitle">'
          + '<div class="news-pullup-top" data-news-pullup-top role="button" tabindex="0"'
          + ' aria-label="News Feed — drag up to open, tap or drag down to minimize when open">'
          + '<div class="news-pullup-title-row" data-news-pullup-title-row>'
          + '<div class="day-alert-h" id="newsPullupTitle">News Feed</div>'
          + '<div class="news-pullup-grab" data-news-pullup-grab aria-hidden="true"><span class="news-pullup-knob"></span></div>'
          + '</div></div>'
          + '<div class="news-pullup-peek-block" data-news-pullup-peek-block>'
          + '<div class="news-pullup-peek" data-news-pullup-peek role="button" tabindex="0"'
          + ' aria-label="Open the News Feed">'
          + '<div class="news-pullup-peek-inner">'
          + '<div class="news-pullup-peek-line">The feed could not be shown. Open for details.</div>'
          + "</div></div></div>"
          + '<div class="news-pullup-panel" data-news-pullup-panel hidden>'
          + '<div class="news-pullup-empty">The feed could not be shown. Open for details.</div>'
          + "</div></div></aside>";
      }
      // Tabs → tab body (or Latest trade) → News Feed pull-up.
      return chips + (tabBody || progress) + hero;
    }

    function renderNews() {
      return renderNewsBody();
    }

    function renderNewsPage() {
      // Same feed the hero opens. Heading comes from renderNewsBody(); replace it with a
      // screen heading. Top-bar back returns to league home.
      return renderNewsBody().replace(
        "<h2>News and Alerts</h2>",
        '<h2 class="screen-h" tabindex="-1">News and Alerts</h2>'
      );
    }

    function renderAccountPage() {
      const uname = (authSession && authSession.username) || "—";
      const L = activeLeague || {};
      const seat = authSeatName() || (authSession && authSession.seat_name) || null;
      const mem = (memberships || []).find((m) => m.sleeper_league_id === L.sleeper_league_id);
      const team = seat || (mem && mem.team_name) || null;
      return '<h2 class="screen-h" tabindex="-1">Account</h2>'
        + '<div class="app-card"><h3>Signed in</h3>'
        + '<p class="caption" style="margin:0">Username <b>' + esc(uname) + "</b></p>"
        + (L.name
          ? '<p class="caption">League <b>' + esc(L.name) + "</b>"
            + (L.sleeper_league_id ? '<br/>ID <code style="user-select:all">' + esc(L.sleeper_league_id) + "</code>" : "")
            + "</p>"
          : "")
        + (team
          ? '<p class="caption">Your seat <b>' + seatLabel(team) + "</b></p>"
          : '<p class="caption">No seat claimed in this league yet.</p>')
        + '<div class="app-actions">'
        + '<button type="button" class="chip" data-view="cosmetics">Titles and Emblems</button>'
        + '<button type="button" class="chip" data-app-settings="1">Open Settings</button>'
        + '<button type="button" class="chip" data-auth-signout="1">Sign out</button>'
        + "</div></div>";
    }

    function renderTeamsPage() {
      const rows = whoOptions();
      return '<h2 class="screen-h" tabindex="-1">Teams</h2>'
        + (rows
          ? '<div class="teams-list" role="list">' + rows + "</div>"
          : '<p class="caption">Teams have not loaded yet.</p>');
    }

    function backChip(label) {
      return '<button type="button" class="chip back" data-back="1">← ' + esc(label || "Back") + "</button>";
    }

    /**
     * Every trade in the league, newest first. trade_boards.sides holds one row per seat per
     * trade, so this dedupes to one row per transaction_id. The side kept is the first one the
     * data lists rather than the winning one, so the left/right framing follows the tape
     * rather than putting the winner on the left of every row. Which side won is carried by
     * the signed delta beside each name, so the order does not have to carry it.
     */
    /** Newest N league trades may carry an inline vote chip on the feed. */
    const FEED_VOTE_LIMIT = 20;

    function feedVoteTxSet() {
      return new Set(leagueTrades().slice(0, FEED_VOTE_LIMIT).map((r) => r.transaction_id));
    }

    function leagueTrades() {
      const sides = (league && league.trade_boards && league.trade_boards.sides) || [];
      const by = new Map();
      for (const r of sides) if (!by.has(r.transaction_id)) by.set(r.transaction_id, r);
      return [...by.values()].sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        // Sleeper transaction ids climb with time, so they order a single day truthfully.
        return a.transaction_id < b.transaction_id ? 1 : a.transaction_id > b.transaction_id ? -1 : 0;
      });
    }

    /** Headlines from both sides of each deal — player filter matches either bag's lead asset. */
    function tapeHeadlinesByTx() {
      const hlByTx = Object.create(null);
      const sides = (league && league.trade_boards && league.trade_boards.sides) || [];
      for (const s of sides) {
        const tx = s.transaction_id;
        if (!hlByTx[tx]) hlByTx[tx] = [];
        if (s.headline) hlByTx[tx].push(String(s.headline));
      }
      return hlByTx;
    }

    /**
     * Filtered league tape for the H2H feed. Shared by the league trades list and the trade
     * detail screen so year / team / player filters behave the same on both.
     */
    function tapeTradesFiltered() {
      const all = leagueTrades();
      const lived = all.filter((r) => chipLived(r.date));
      const hlByTx = tapeHeadlinesByTx();
      const years = [...new Set(lived.map((r) => String(r.date || "").slice(0, 4)).filter(Boolean))]
        .sort()
        .reverse();
      const teams = (members || []).map((m) => m.name).filter(Boolean)
        .slice()
        .sort((a, b) => a.localeCompare(b));
      let list = lived;
      if (tapeYear !== "all") {
        list = list.filter((r) => String(r.date || "").slice(0, 4) === tapeYear);
      }
      if (tapeTeam !== "all") {
        list = list.filter((r) => r.name === tapeTeam || r.other === tapeTeam);
      }
      const playerPool = [];
      {
        const seen = new Set();
        for (const r of list) {
          for (const h of hlByTx[r.transaction_id] || []) {
            const leg = guessLegFromHeadline(h);
            if (!leg || leg.kind !== "player") continue;
            const key = String(leg.label || "").trim();
            if (!key || seen.has(key.toLowerCase())) continue;
            seen.add(key.toLowerCase());
            playerPool.push(key);
          }
        }
        playerPool.sort((a, b) => a.localeCompare(b));
      }
      const playerNeedle = (tapePlayerQ || "").trim().toLowerCase();
      if (tapePlayer !== "all") {
        const want = String(tapePlayer).toLowerCase();
        list = list.filter((r) => (hlByTx[r.transaction_id] || [])
          .some((h) => String(h).toLowerCase() === want || String(h).toLowerCase().includes(want)));
      } else if (playerNeedle) {
        list = list.filter((r) => (hlByTx[r.transaction_id] || [])
          .some((h) => String(h).toLowerCase().includes(playerNeedle)));
      }
      const filtered = tapeYear !== "all" || tapeTeam !== "all" || tapePlayer !== "all" || !!playerNeedle;
      const empty = !all.length
        ? '<p class="caption">No trades on the league tape yet.</p>'
        : !lived.length
          ? '<p class="caption">No trade in the league has lived ' + esc(clockName())
            + " yet. Switch to as of today to see them.</p>"
          : !list.length
            ? '<p class="caption">No trades match these filters. Clear a filter to widen the feed.</p>'
            : "";
      return { all, lived, list, years, teams, playerPool, filtered, empty, playerNeedle };
    }

    function voteToastHtml() {
      if (!voteToast) return "";
      let bit = "";
      if (voteToast.fair) {
        bit = " — you marked that one <b>Fair</b>";
      } else if (voteToast.name) {
        bit = " — you have <b>" + seatLabel(voteToast.name) + "</b> winning that one";
      }
      return '<p class="vote-note">Vote recorded' + bit
        + ". One vote per trade — you can change sides within 24 hours of your first cast.</p>";
    }

    /** Year / team / player filter row + dropdown panel for league-wide trade feeds. */
    function tapeFilterHtml(ctx, defaultHint) {
      const hintBits = [];
      if (tapeYear !== "all") hintBits.push(tapeYear);
      if (tapeTeam !== "all") hintBits.push(tapeTeam);
      if (tapePlayer !== "all") hintBits.push(tapePlayer);
      else if (ctx.playerNeedle) hintBits.push('"' + tapePlayerQ.trim() + '"');
      const filterHint = ctx.filtered
        ? "Filter · " + hintBits.join(" · ")
        : (defaultHint || "Filter by year, team, or player");
      const filterBtn = '<button type="button" class="filter-btn'
        + (ctx.filtered || tapeFilterOpen ? " on" : "") + '" data-tfilter="1" aria-label="Filter trades"'
        + ' aria-expanded="' + (tapeFilterOpen ? "true" : "false") + '">'
        + '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 5h16l-6.2 7.2V19l-3.6 1.8v-8.6L4 5z"/></svg>'
        + (ctx.filtered ? '<span class="dot"></span>' : "")
        + "</button>"
        + '<div class="caption">' + esc(filterHint) + "</div>";
      const yearRadios = [["all", "All"]].concat(ctx.years.map((y) => [y, y])).map((row) =>
        '<label data-tape-year="' + esc(row[0]) + '"><input type="radio" name="tapeYear" value="'
        + esc(row[0]) + '"' + (tapeYear === row[0] ? " checked" : "") + "> "
        + esc(row[1]) + "</label>"
      ).join("");
      const teamRadios = [["all", "All teams"]].concat(ctx.teams.map((n) => [n, n])).map((row) =>
        '<label data-tape-team="' + esc(row[0]) + '"><input type="radio" name="tapeTeam" value="'
        + esc(row[0]) + '"' + (tapeTeam === row[0] ? " checked" : "") + "> "
        + esc(row[1]) + "</label>"
      ).join("");
      const playerRadios = [["all", "All players"]].concat(ctx.playerPool.slice(0, 80).map((n) => [n, n]))
        .map((row) =>
          '<label data-tape-player="' + esc(row[0]) + '"><input type="radio" name="tapePlayer" value="'
          + esc(row[0]) + '"' + (tapePlayer === row[0] ? " checked" : "") + "> "
          + esc(row[1]) + "</label>"
        ).join("");
      const panel = tapeFilterOpen
        ? '<div class="filter-panel" id="tapeFilters">'
          + '<div class="filter-h">Year</div>'
          + yearRadios
          + '<hr class="rule" />'
          + '<div class="filter-h">Team</div>'
          + teamRadios
          + '<hr class="rule" />'
          + '<div class="filter-h">Player</div>'
          + '<input type="search" data-tape-player-q="1" placeholder="Search player or pick label…"'
          + ' value="' + esc(tapePlayerQ) + '" aria-label="Search players in trades"'
          + ' autocomplete="off" spellcheck="false" />'
          + playerRadios
          + "</div>"
        : "";
      return '<div class="filter-wrap">' + filterRow(filterBtn) + panel + "</div>";
    }

    function renderLeagueTrades() {
      const ctx = tapeTradesFiltered();
      const { lived, list, empty } = ctx;
      ensureTradesFeedBags(list);
      const shown = list.slice(0, tapeLimit);
      const cards = shown.map((r) => tradeFeedCardHtml(r)).join("");
      const more = list.length > shown.length
        ? '<button type="button" class="chip" data-tape-more="1">Show more trades ('
          + (list.length - shown.length) + " left)</button>"
        : "";
      // No back chip here on purpose. This screen's parent is always league home, which is
      // exactly what the home icon in the header does — a second control beside it would say
      // the same thing twice. The trade screen does get one, because its parent varies.
      return '<h2 class="screen-h" tabindex="-1">League trades</h2>'
        // "the tape" is trade_boards.sides, and it carries only complete two-team trades: the
        // league's two three-team deals have no row there, so this is 288 of 290. Saying "the
        // tape" rather than "the league" is the difference between a claim and a fact.
        + voteToastHtml()
        + tapeFilterHtml(ctx)
        + empty
        + (cards ? '<div class="trades-feed">' + cards + "</div>" : "")
        + more;
    }

    /**
     * Map a seat-file trade onto the league tape side the feed cards expect, and stash the
     * seat bag so latestTradeCardHtml can paint assets without a second fetch. Every surface
     * that lists a seat's deals (Trades tab, best/worst, partners) goes through this so vote
     * state keyed by transaction_id matches the league feed.
     */
    function seatTradeSide(t) {
      if (!t || !t.transaction_id) return null;
      rememberTradeBag(t.transaction_id, t);
      const uid = (me && me.user_id) || null;
      const side = tradeSide(t.transaction_id, uid) || tradeSide(t.transaction_id, null);
      if (side) return side;
      // Tape gap (rare): still paint a framed card from the seat file so the deal is not lost.
      const otherNames = (t.others || []);
      return {
        transaction_id: t.transaction_id,
        date: t.date,
        user_id: uid,
        name: (me && me.name) || "This seat",
        other: otherNames.join(" · ") || "Them",
        headline: "",
        windows: t.windows || {},
      };
    }

    /** One seat trade as the same H2H + vote card the league feed uses. */
    function seatTradeFeedCardHtml(t) {
      const side = seatTradeSide(t);
      if (!side) return "";
      // Seat surfaces expand in place (audit: Trades tab / best / worst / partners) — never
      // jump to the league-wide ?view=trade screen the board-open path uses.
      if (openId === t.transaction_id) {
        return tradeFeedSelectedHtml(side, { seatInline: true });
      }
      return tradeFeedCardHtml(side, { seatExpand: true });
    }

    /** One feed card: home Latest-trade H2H chip, framed with date + open-trade attrs. */
    function tradeFeedCardHtml(r, opts) {
      const seatExpand = !!(opts && opts.seatExpand);
      const voted = !!readVotes(r.transaction_id).choice;
      const showVote = feedVoteTxSet().has(r.transaction_id);
      let chip = "";
      try {
        chip = latestTradeBagsReady(r.transaction_id)
          ? latestTradeCardHtml(r)
          : latestTradeSkeletonHtml(r);
      } catch (err) {
        console.error(err);
        chip = '<div class="h2h-chip is-trade" role="group">'
          + '<div class="h2h-side is-left"><div class="h2h-name">' + seatLabel(r.name) + "</div></div>"
          + '<div class="h2h-vs" aria-hidden="true">VS</div>'
          + '<div class="h2h-side is-right"><div class="h2h-name">' + seatLabel(r.other) + "</div>"
          + '<div class="h2h-meta">' + esc(r.headline || "Open trade") + "</div></div>"
          + "</div>";
      }
      // Vote buttons cannot nest inside a role=button card — open lives on the main block.
      // Seat expand uses data-seat-trade-open (inline); league feed uses data-board-open (screen).
      const main = '<div class="lh-trade-feed-main" role="button" tabindex="0"'
        + (seatExpand
          ? (' data-seat-trade-open="' + esc(r.transaction_id) + '"'
            + ' aria-expanded="false"')
          : (' data-board-open="' + esc(r.user_id) + '" data-id="' + esc(r.transaction_id) + '"'))
        + ' aria-label="' + esc(r.name) + " vs " + esc(r.other) + '">'
        + '<div class="day-alert-h">' + esc(r.date || "") + "</div>"
        + chip
        + "</div>";
      return '<div class="lh-trade-feed-card' + (voted ? " voted" : "") + (showVote ? " has-vote" : "") + '">'
        + main
        + (showVote ? '<div class="vote-card">' + voteBlock(r) + "</div>" : "")
        + (voted ? '<span class="sr-only">You voted on this trade.</span>' : "")
        + "</div>";
    }


    function tradeFeedSelectedHtml(r, opts) {
      const seatInline = !!(opts && opts.seatInline);
      const voted = !!readVotes(r.transaction_id).choice;
      let chip = "";
      try {
        chip = latestTradeBagsReady(r.transaction_id)
          ? latestTradeCardHtml(r)
          : latestTradeSkeletonHtml(r);
      } catch (err) {
        console.error(err);
        chip = '<div class="h2h-chip is-trade" role="group">'
          + '<div class="h2h-side is-left"><div class="h2h-name">' + seatLabel(r.name) + "</div></div>"
          + '<div class="h2h-vs" aria-hidden="true">VS</div>'
          + '<div class="h2h-side is-right"><div class="h2h-name">' + seatLabel(r.other) + "</div>"
          + '<div class="h2h-meta">' + esc(r.headline || "Open trade") + "</div></div>"
          + "</div>";
      }
      // Seat inline: date row collapses the expand; picks/votes stay interactive below.
      const head = seatInline
        ? ('<button type="button" class="day-alert-h lh-trade-feed-collapse" data-seat-trade-open="'
          + esc(r.transaction_id) + '" aria-expanded="true"'
          + ' aria-label="Collapse trade details">' + esc(r.date || "Trade") + "</button>")
        : ('<div class="day-alert-h">' + esc(r.date || "") + "</div>");
      return '<div class="lh-trade-feed-card is-selected' + (voted ? " voted" : "") + '"'
        + ' data-id="' + esc(r.transaction_id) + '"'
        + ' aria-label="' + esc(r.name) + " vs " + esc(r.other) + '">'
        + head
        + chip
        + '<div class="vote-card">' + voteBlock(r) + "</div>"
        + (voted ? '<span class="sr-only">You voted on this trade.</span>' : "")
        + "</div>";
    }

    /**
     * One trade as a feed: the opened deal stays at the top (H2H chip + bags + vote), with the
     * rest of the league tape below as the same cards home and ?view=trades use.
     */
    function renderTradeScreen() {
      const selected = tradeSide(openId, tradeSeat);
      if (!openId || !selected) {
        return backChip("Back")
          + '<h2 class="screen-h" tabindex="-1">Trade not found</h2>'
          + '<p class="caption">That trade is not on the league tape.</p>'
          + '<button type="button" class="chip" data-trades-list="1">All league trades</button>';
      }
      const ctx = tapeTradesFiltered();
      const { lived, list, empty } = ctx;
      const rest = list.filter((r) => r.transaction_id !== openId);
      ensureTradesFeedBags([selected].concat(rest));
      const shown = rest.slice(0, tapeLimit);
      const cards = shown.map((r) => tradeFeedCardHtml(r)).join("");
      const more = rest.length > shown.length
        ? '<button type="button" class="chip" data-tape-more="1">Show more trades ('
          + (rest.length - shown.length) + " left)</button>"
        : "";
      const feedBody = tradeFeedSelectedHtml(selected)
        + cards;
      return backChip("Back")
        + '<h2 class="screen-h" tabindex="-1">League trade data</h2>'
        + voteToastHtml()
        + tapeFilterHtml(ctx)
        + (list.length ? "" : empty)
        + '<div class="trades-feed">' + feedBody + "</div>"
        + more;
    }

    function partnerLine(p) {
      return '<div class="row" role="button" tabindex="0" data-partner="' + esc(p.name) + '">'
        + '<div class="row-top"><div><div class="names">' + seatLabel(p.name) + "</div>"
        + '<div class="date">' + p.n + " complete · " + gradeLabel(p.grade) + "</div></div>"
        + '<div class="margin">' + tapeMargin(p.per) + "</div></div></div>";
    }

    function draftLine(p, tag) {
      if (!p) return "";
      return '<div class="row"><div class="row-top"><div><div class="names">' + esc(p.player) + "</div>"
        + '<div class="date">' + esc(tag) + " · " + esc(p.season) + " R" + esc(p.round) + "</div></div>"
        + '<div class="margin">' + tapeMargin(p.surplus) + "</div></div></div>";
    }

    function mark(id, title, sub, tone) {
      const on = markOpen === id;
      return '<button type="button" class="mark' + (tone ? " " + tone : "") + (on ? " on" : "") + '" data-mark="' + esc(id) + '" aria-expanded="' + on + '">'
        + "<b>" + esc(title) + "</b>" + (sub ? "<span>" + esc(sub) + "</span>" : "") + "</button>";
    }

    /**
     * Every number here is precomputed in apply-value-adjust.mjs and shipped in marks.json.
     * The browser used to recompute them from a seat file, which is why the home "manners"
     * tile and the Partners tab disagreed on 20 of 82 grades: the tile read the pipeline's
     * today-clock grade while the tab regraded on the selected clock.
     */
    function marksOf(row) {
      const m = row || {};
      const w = (m.lens && m.lens[lens]) || {};
      const runW = (m.lens && m.lens[runLens]) || {};
      const n = m.two_way || 0;
      const volume = n >= 80 ? "Hyper" : n >= 40 ? "Active" : "Quiet";
      const soldPicks = m.sold_picks || 0;
      const soldPlayers = m.sold_players || 0;
      let posture = "Swap shop";
      if (soldPlayers >= soldPicks + 5) posture = "Buys picks";
      else if (soldPicks >= soldPlayers + 5) posture = "Buys players";
      const extract = w.extract || 0;
      const farmed = w.farmed || 0;
      const even = w.even || 0;
      let manners = "Fair";
      let mannersTone = "";
      if (farmed >= extract + 2) { manners = "Gets extracted"; mannersTone = "neg"; }
      else if (extract > farmed) { manners = "Extracts"; mannersTone = "pos"; }
      const aged = { length: (m.aging && m.aging.n) || 0 };
      const ageMean = (m.aging && m.aging.mean != null) ? m.aging.mean : null;
      let aging = "Held";
      let agingTone = "";
      if (ageMean != null && ageMean > 100) { aging = "Aged up"; agingTone = "pos"; }
      else if (ageMean != null && ageMean < -100) { aging = "Aged down"; agingTone = "neg"; }
      const rook = { length: (m.draft && m.draft.n) || 0 };
      const draftMean = (m.draft && m.draft.mean != null) ? m.draft.mean : null;
      let draft = "Mixed";
      let draftTone = "";
      if (draftMean != null && draftMean > 200) { draft = "Hit factory"; draftTone = "pos"; }
      else if (draftMean != null && draftMean < -500) { draft = "Miss factory"; draftTone = "neg"; }
      const total = runW.total == null ? null : runW.total;
      const per = runW.per == null ? null : runW.per;
      let run = "Even";
      let runTone = "";
      if (total != null && total > 0) { run = "Ahead"; runTone = "pos"; }
      else if (total != null && total < 0) { run = "Behind"; runTone = "neg"; }
      const volumeSub = n >= 80
        ? n + " two-way trades. 80+ is Hyper."
        : n >= 40
          ? n + " two-way trades. 40–79 is Active."
          : n + " two-way trades. Under 40 is Quiet.";
      let postureSub = soldPicks + " picks sold for players vs " + soldPlayers + " the other way. Within 5 is Swap shop.";
      if (posture === "Buys picks") {
        postureSub = soldPlayers + " players sold for picks vs " + soldPicks + " the other way. Five or more extra is Buys picks.";
      } else if (posture === "Buys players") {
        postureSub = soldPicks + " picks sold for players vs " + soldPlayers + " the other way. Five or more extra is Buys players.";
      }
      let mannersSub = "You came out ahead vs " + extract + " partners. Partners came out ahead vs you on " + farmed + (even ? ". " + even + " even" : "") + ". Close enough is Fair.";
      if (manners === "Gets extracted") mannersSub = farmed + " partners came out ahead vs you. You came out ahead vs " + extract + ".";
      else if (manners === "Extracts") mannersSub = "You came out ahead vs " + extract + " partners. Partners came out ahead vs you on " + farmed + ".";
      let agingSub = "No accept-day value to compare.";
      if (ageMean != null && aging === "Aged up") agingSub = "Trades got better after you accepted (" + signedNum(ageMean) + " on average).";
      else if (ageMean != null && aging === "Aged down") agingSub = "Trades got worse after you accepted (" + signedNum(ageMean) + " on average).";
      else if (ageMean != null) agingSub = "Trades are worth about the same as the day you accepted.";
      let draftSub = "No graded rookie picks yet.";
      if (draftMean != null && draft === "Hit factory") draftSub = "Rookie picks usually turn into more than the pick was worth (" + rook.length + " graded).";
      else if (draftMean != null && draft === "Miss factory") draftSub = "Rookie picks usually turn into less than the pick was worth (" + rook.length + " graded).";
      else if (draftMean != null) draftSub = "Some rookies hit, some missed. Net is about even (" + rook.length + " graded).";
      const runSub = per == null
        ? "No complete deals to total yet."
        : signedNum(total) + " net, about " + signedNum(per) + " per deal.";
      // statHtml, not stat: these lines carry a coloured delta span, so they ship as markup and
      // are rendered unescaped. Every part of them is a number or a literal from this function --
      // no manager, player or partner name may ever be concatenated in here. Counts are counts
      // and stay unsigned; only a value delta gets a sign.
      return {
        run: { title: run, tone: runTone, sort: total == null ? 0 : total, sub: runSub,
          statHtml: per == null ? "No complete deals" : tapeMargin(total) + " net · " + tapeMargin(per) + " / deal" },
        volume: { title: volume, tone: "", sort: n, sub: volumeSub, statHtml: n + " two-way" },
        posture: { title: posture, tone: "", sort: soldPicks - soldPlayers, sub: postureSub,
          statHtml: soldPicks + " picks for players · " + soldPlayers + " players for picks" },
        manners: { title: manners, tone: mannersTone, sort: extract - farmed, sub: mannersSub,
          statHtml: extract + " extracts · " + farmed + " extracted" + (even ? " · " + even + " even" : "") },
        aging: { title: aging, tone: agingTone, sort: ageMean == null ? 0 : ageMean, sub: agingSub,
          statHtml: ageMean == null ? "No accept-day compare" : tapeMargin(ageMean) + " after accept · " + aged.length + " deals" },
        draft: { title: draft, tone: draftTone, sort: draftMean == null ? 0 : draftMean, sub: draftSub,
          statHtml: draftMean == null ? "No graded rookies" : tapeMargin(draftMean) + " / pick · " + rook.length + " graded" },
      };
    }

    function markChart() {
      if (!markOpen) return "";
      const heads = {
        run: ["Ahead or behind", runLensCaption()],
        volume: ["How much they trade", "Two-way count. 80+ Hyper, 40–79 Active, under 40 Quiet."],
        posture: ["Players vs picks", "Picks sold for players vs players sold for picks."],
        manners: ["Who extracts", "Partners they beat vs partners who beat them."],
        aging: ["Aged after accept", "How 2-team trades moved after the day they accepted."],
        draft: ["Rookie hits", "Mean surplus vs the pick."],
      };
      const head = heads[markOpen] || ["League", ""];
      const seats = (marks && marks.seats) || {};
      const rows = members
        .filter((mem) => seats[mem.user_id])
        .map((mem) => ({ name: mem.name, uid: mem.user_id, ...marksOf(seats[mem.user_id])[markOpen] }));
      if (!rows.length) {
        const emptyHead = markOpen === "run"
          ? '<div class="mark-chart-h-row"><div class="mark-chart-h-copy">' + esc(head[0])
            + (head[1] ? "<span>" + esc(head[1]) + "</span>" : "") + "</div>" + runLensHtml() + "</div>"
          : '<div class="mark-chart-h">' + esc(head[0]) + "</div>";
        return '<div class="mark-chart">' + emptyHead
          + '<p class="caption">No league marks in this build.</p></div>';
      }
      rows.sort((a, b) => b.sort - a.sort);
      const maxAbs = Math.max.apply(null, rows.map((r) => Math.abs(r.sort)).concat([1]));
      const chartHead = markOpen === "run"
        ? '<div class="mark-chart-h-row"><div class="mark-chart-h-copy">' + esc(head[0])
          + (head[1] ? "<span>" + esc(head[1]) + "</span>" : "") + "</div>" + runLensHtml() + "</div>"
        : '<div class="mark-chart-h">' + head[0] + (head[1] ? "<span>" + head[1] + "</span>" : "") + "</div>";
      return '<div class="mark-chart">'
        + chartHead
        + rows.map((r, i) => {
          const you = me && me.user_id === r.uid;
          const pct = Math.round(Math.abs(r.sort) / maxAbs * 100);
          return '<div class="mark-bar' + (you ? " you" : "") + '">'
            + '<div class="mark-bar-top"><span class="names">' + (i + 1) + ". " + seatLabel(r.name) + "</span>"
            + '<span class="lab' + (r.tone ? " " + r.tone : "") + '">' + esc(r.title) + "</span></div>"
            + '<div class="mark-bar-track"><i class="' + (r.tone || "") + '" style="width:' + pct + '%"></i></div>'
            + '<div class="date">' + r.statHtml + "</div></div>";
        }).join("")
        + "</div>";
    }

    function authSeatCanonName() {

    /**
